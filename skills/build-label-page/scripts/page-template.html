<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap">
<style>
/* One look, dark whatever the viewer's theme (Material Ocean, no purple): every color is a token below.
   One column, sections apart by a hairline and wide space, items flat; the only raised block of an item is
   the question being asked. Answer buttons are full-width rows with space between them, so a thumb cannot
   land between two of them, and the chosen one has a 2px accent border. */
:root {
  color-scheme: dark;
  --bg: #0f111a; --surface: #1a1c25; --line: #262a3a; --text: #a6accd; --muted: #7e84a3;
  --strong: #eeffff; --accent: #82aaff; --good: #c3e88d; --mark: #ffcb6b; --bad: #f07178;
  --mark-bg: rgba(255, 203, 107, 0.08);
  --sans: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gap-section: 48px; --gap-item: 16px; --measure: 68ch;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.6; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column;
  gap: var(--gap-section); overflow-wrap: anywhere; }
main > * + section, main > section + * { border-top: 1px solid var(--line); padding-top: var(--gap-section); }
header.top { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0; color: var(--strong); font-weight: 700; }
h2 { font-size: 1.15rem; line-height: 1.4; margin: 0; color: var(--strong); font-weight: 500; }
p { margin: 0; max-width: var(--measure); }
.muted { color: var(--muted); }
.id { font-family: var(--mono); color: var(--muted); }
section { display: flex; flex-direction: column; gap: var(--gap-item); }
.item { display: flex; flex-direction: column; gap: 20px; padding-top: var(--gap-item);
  border-top: 1px solid var(--line); }
/* The evidence of a card: one labelled row per field, the label a short word above its content. The two
   readings sit in the same place on every card: A on a solid accent rule, B on a dashed one. */
.row { display: flex; flex-direction: column; gap: 4px; }
.lbl { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.reading { border-left: 3px solid var(--accent); padding-left: 12px; }
.reading.b { border-left: 3px dashed var(--text); }
mark { background: transparent; color: var(--mark); font-weight: 500; }
.item:first-of-type { border-top: 0; padding-top: 0; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; }
.q { color: var(--strong); font-weight: 500; }
.body { color: var(--strong); }
h3 { font-size: 1rem; margin: 0; color: var(--strong); font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; text-align: left; width: 100%; }
button[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--strong); padding: 9px 15px; }
.opts button { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: start; }
.opts button .icon { grid-row: span 2; font-size: 1.25rem; line-height: 1.6; }
.opts button .label { color: var(--strong); font-weight: 500; grid-column: 2; }
.opts button .ex { color: var(--muted); grid-column: 2; }
.opts button[aria-pressed="true"] { background: var(--surface); }
textarea.why { font: inherit; color: var(--strong); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-height: 88px; width: 100%; }
pre.code .line { display: flex; gap: 0; white-space: pre; min-height: 1.4em; }
pre.code .ws { color: var(--muted); }
pre.code .len { margin-left: auto; padding-left: 16px; color: var(--muted); font-size: 0.85em; user-select: none; }
code { font-family: var(--mono); font-size: 0.92em; color: var(--strong); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
button:disabled { opacity: 0.5; cursor: default; }
.answered { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
.answered button { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; }
.examples { display: flex; flex-direction: column; gap: 12px; }
.example b { color: var(--strong); font-weight: 500; display: block; }
.quote, .banner { background: var(--mark-bg); border-left: 2px solid var(--mark); padding: 10px 14px;
  border-radius: 0 8px 8px 0; color: var(--text); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--good); }
.tabs { display: flex; gap: 24px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { width: auto; border: 0; border-radius: 0; padding: 10px 0; min-height: 44px; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--strong); border: 0; border-bottom: 2px solid var(--accent);
  padding: 10px 0; }
ul { margin: 0; padding-left: 1.2rem; }
pre { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; font-family: var(--mono); font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
  margin: 0; }
.status { color: var(--muted); }
.status.saved::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--good); margin-right: 8px; vertical-align: middle; }
.status.missing { color: var(--mark); }
.status.failed { color: var(--bad); }
/* The content blocks (#380): a code excerpt with its line numbers and the marked line lit, references,
   lists and tables folded away. A long text shows three lines and a «more». */
a { color: var(--accent); }
summary { cursor: pointer; color: var(--accent); min-height: 44px; display: flex; align-items: center; gap: 8px; }
.situation { color: var(--strong); font-weight: 500; }
pre.numbered { white-space: normal; padding: 8px 0; }
pre.numbered .line { display: grid; grid-template-columns: 2ch 5ch 1fr; white-space: pre-wrap; padding: 0 10px 0 0; }
/* The marked line reads as marked without its colour: a marker in the gutter and a label after the code. */
pre.numbered .g { color: var(--mark); text-align: center; user-select: none; }
pre.numbered .this { color: var(--mark); font-weight: 700; margin-left: 1ch; white-space: nowrap; user-select: none; }
pre.numbered .n { color: var(--muted); text-align: right; padding-right: 1.5ch; user-select: none; }
pre.numbered .hit { background: var(--mark-bg); }
pre.numbered .hit .n { color: var(--mark); font-weight: 700; }
.rulebox { display: flex; flex-direction: column; gap: 8px; }
.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* The clamp cuts at the padding box, so a code block's bottom padding is a border: no fourth line peeks in. */
pre.clamped { padding-bottom: 0; border-bottom: 10px solid var(--surface); box-shadow: 0 1px 0 var(--line); }
button.more { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; align-self: flex-start; }
.setting { display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.match.yes { color: var(--good); }
.match.no { color: var(--bad); }
.who { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
.who button { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; }
</style>
<main id="app"><p class="muted">Loading…</p></main>
<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var app = document.getElementById("app");
  var state = {
    answers: {},      // item id -> {answers, savedAt, source}, from the store
    groups: {},       // group id -> {familiarity, savedAt, source}
    practice: {},     // r<round>-P<n> -> {answers, savedAt, source}; the FIRST answer, kept apart
    editing: {},      // item id -> the question id the labeller tapped "Change" on
    mineWhy: {},      // item id -> the reasons this page has just written (ahead of the store)
    draftWhy: {},     // item id -> {question id: text typed and not yet saved}
    whyTimers: {},    // "<item id>|<question id>" -> the pending save of a reason being typed
    whyBoxes: {},     // "<item id>|<question id>" -> the reason box of the last render
    typingIn: null,   // the item whose reason box has the keyboard: shown even when complete
    lastAnswered: null, // the item answered last: shown under "Next unanswered" until the next answer
    pending: {},      // item id -> answers chosen whose reason is still empty: NOT in the store
    refusedWhy: {},   // item id -> true when an empty reason was refused for its answer
    mine: {},         // item/group key -> the answers this page has just written (ahead of the store)
    inflight: {},     // item/group key -> writes not yet confirmed
    failed: {},       // item/group key -> error code of the last refused write
    loaded: { answers: false, groups: false, practice: false },
    store: "loading", // loading | ok | none
    filter: "all",
    who: null,        // the answerer picked, on a page with DATA.answerers; null until one is
    raw: { answers: {}, groups: {}, practice: {} }, // every document of the store, every answerer's
    dwell: {},        // item id -> ms its card was on screen, clocks stopped (DATA.min_seconds)
    seenSince: {},    // item id -> when its card came on screen, while it is
    firstSeconds: {}, // item id -> the seconds this page stored with the item's first save
    gates: {}         // item id -> the locked buttons and the countdown of the last render
  };
  var db = null;
  var chains = {};
  var WHY_PAUSE_MS = 800;

  try { if (localStorage.getItem("label-filter") === "next") state.filter = "next"; } catch (e) {}
  // ── who is answering (DATA.answerers): each answerer's documents are "<answerer>~<id>" ─────
  // "~" is outside the build's name pattern, so no answerer, item, group or practice id holds it.
  var SEP = "~";
  var ANSWERERS = DATA.answerers || [];
  var ASKS_WHO = ANSWERERS.length > 0;
  try {
    var remembered = localStorage.getItem("label-answerer");
    if (ANSWERERS.indexOf(remembered) !== -1) state.who = remembered;
  } catch (e) {}
  // The store's id of one of this page's documents: as before on a page without answerers.
  function docName(id) { return ASKS_WHO ? state.who + SEP + id : id; }
  // The documents of the current answerer, by their names without the answerer.
  function mineOf(docs) {
    if (!ASKS_WHO) return docs;
    var out = {}, prefix = state.who + SEP;
    if (state.who) Object.keys(docs).forEach(function (k) { if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = docs[k]; });
    return out;
  }
  // The items shown to the current answerer: an item's own `answerers`, else everyone's.
  function itemsShown() {
    return DATA.items.filter(function (i) { return !i.answerers || i.answerers.indexOf(state.who) !== -1; });
  }
  function groupsShown() { return DATA.groups.filter(function (g) { return groupItems(g.id).length > 0; }); }
  function busy() {
    return Object.keys(state.inflight).some(function (k) { return state.inflight[k] > 0; }) || Object.keys(state.whyTimers).length > 0;
  }
  // Picking (or switching) the answerer: everything this page holds of the last one is dropped.
  function choose(name) {
    if (busy()) return;
    Object.keys(state.seenSince).forEach(stopClock);
    state.who = name;
    try {
      if (name) localStorage.setItem("label-answerer", name);
      else localStorage.removeItem("label-answerer");
    } catch (e) {}
    ["editing", "mineWhy", "draftWhy", "pending", "refusedWhy", "mine", "failed", "dwell", "seenSince", "firstSeconds"]
      .forEach(function (k) { state[k] = {}; });
    state.lastAnswered = null;
    ["answers", "groups", "practice"].forEach(function (c) { state[c] = mineOf(state.raw[c]); });
    render();
  }
  // ── how long a card was on screen (DATA.min_seconds): its answer saves only after that long ──
  // On screen: half the card in view, or half the viewport filled by a card taller than it.
  var MIN_SECONDS = DATA.min_seconds || 0;
  function dwellMs(id) {
    var ms = state.dwell[id] || 0;
    return state.seenSince[id] !== undefined ? ms + Date.now() - state.seenSince[id] : ms;
  }
  function stopClock(id) {
    if (state.seenSince[id] === undefined) return;
    state.dwell[id] = dwellMs(id);
    delete state.seenSince[id];
  }
  function startClock(id) { if (state.seenSince[id] === undefined) state.seenSince[id] = Date.now(); }
  // An item already saved (by this page or in the store) is never locked again.
  function unsaved(id) { return !state.answers[id] && state.firstSeconds[id] === undefined; }
  function locked(id) { return MIN_SECONDS > 0 && unsaved(id) && dwellMs(id) < MIN_SECONDS * 1000; }
  function waitText(id) {
    return "\u23f3 You can answer in " + Math.ceil((MIN_SECONDS * 1000 - dwellMs(id)) / 1000) + " s";
  }
  // The seconds stored with an item: those of its first save, kept on every later write.
  function secondsOf(id) {
    var d = state.answers[id];
    if (d && typeof d.seconds === "number") return d.seconds;
    if (state.firstSeconds[id] === undefined) state.firstSeconds[id] = Math.floor(dwellMs(id) / 1000);
    return state.firstSeconds[id];
  }
  var observer = null;
  var THRESHOLDS = [];
  for (var t = 0; t <= 20; t += 1) THRESHOLDS.push(t / 20);
  // The share of the card that must be in view is rounded up to the observer's 5 % steps: the
  // observer reports only when a step is crossed, so a share between two steps could be left
  // behind with no report and the clock still running.
  function onScreen(entry) {
    var h = entry.boundingClientRect.height;
    if (!entry.isIntersecting || h <= 0) return false;
    var need = Math.ceil((Math.min(h, window.innerHeight) / 2 / h) * 20) / 20;
    return entry.intersectionRect.height / h >= need - 1e-9;
  }
  // Every render draws new cards: the clocks stop, and the new cards are watched from scratch.
  function watchCards() {
    if (observer) observer.disconnect();
    observer = null;
    var cards = Array.prototype.slice.call(document.querySelectorAll("article.item[data-id]"));
    if (typeof IntersectionObserver !== "function") {
      // No way to tell what is in view: a card counts as on screen from the moment it is drawn.
      cards.forEach(function (c) { startClock(c.getAttribute("data-id")); });
      return;
    }
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var id = e.target.getAttribute("data-id");
        if (onScreen(e) && document.visibilityState !== "hidden") startClock(id);
        else stopClock(id);
      });
    }, { threshold: THRESHOLDS });
    cards.forEach(function (c) { observer.observe(c); });
  }
  // The countdown on each locked card, and its buttons let go when its time is up; no render, so
  // a section the labeller opened stays open.
  function tick() {
    Object.keys(state.gates).forEach(function (id) {
      var g = state.gates[id];
      if (locked(id)) { g.note.textContent = waitText(id); return; }
      g.note.textContent = "";
      g.buttons.forEach(function (b) { b.disabled = !canWrite(); });
      delete state.gates[id];
    });
    setTimeout(tick, 250);
  }

  // ── what "done" means ────────────────────────────────────────────────────────────────────
  function answersOf(id) {
    return state.pending[id] || savedOf(id);
  }
  // A stored value is an answer only if the build offers it (DATA.allowed, the same lists the
  // export reads from key.json): after a rebuild that removed an option, or a typo merged from chat,
  // the question is unanswered again and says so.
  function valid(allowed, v) { return allowed.indexOf(v) !== -1; }
  function reasonsOf(id) {
    if (state.mineWhy[id]) return state.mineWhy[id];
    var d = state.answers[id];
    return d && d.reasons ? d.reasons : {};
  }
  function keepDraft(id, qid, text) {
    state.draftWhy[id] = Object.assign({}, state.draftWhy[id] || {});
    state.draftWhy[id][qid] = text;
  }
  // The text typed for a reason and not yet in the store; a draft the store now holds is done.
  function draftOf(id, qid) {
    var d = state.draftWhy[id];
    if (!d || !Object.prototype.hasOwnProperty.call(d, qid)) return undefined;
    var stored = state.answers[id] && state.answers[id].reasons;
    if (stored && stored[qid] === d[qid]) { delete d[qid]; return undefined; }
    return d[qid];
  }
  function needsWhy(q, v) { return (DATA.allowed.needs_why[q.id] || []).indexOf(v) !== -1; }
  function questionOf(qid) { return DATA.questions.filter(function (q) { return q.id === qid; })[0]; }
  // What an item still needs: an answer, or the reason its answer asks for (named "<short> (why)").
  function missingFor(id) {
    var a = answersOf(id), r = reasonsOf(id);
    return DATA.questions.map(function (q) {
      if (!valid(DATA.allowed.questions[q.id], a[q.id])) return q;
      if (needsWhy(q, a[q.id]) && !(r[q.id] || "").trim()) {
        return { id: q.id, text: q.text + " (why)", short: (q.short || q.text) + " (why)" };
      }
      return null;
    }).filter(function (q) { return q !== null; });
  }
  function itemDone(id) { return missingFor(id).length === 0; }
  // A page built with "familiarity": false asks no group anything (an approval page): every group
  // counts as rated, and neither the question nor "how well you know it" is ever shown.
  var ASKS_FAMILIARITY = DATA.familiarity.length > 0;
  function familiarity(g) {
    if (!ASKS_FAMILIARITY) return null;
    var d = state.mine["group:" + g] || state.groups[g];
    return d && valid(DATA.allowed.familiarity, d.familiarity) ? d.familiarity : undefined;
  }
  function groupItems(g) { return itemsShown().filter(function (i) { return i.group === g; }); }
  // ── the practice (rule 8): known answers, before the real items ──────────────────────────
  function practiceDoc(pid) { return "r" + DATA.practice.round + "-" + pid; }
  function practiceAnswers(pid) {
    var key = "practice:" + pid;
    if (state.mine[key]) return state.mine[key];
    var d = state.practice[practiceDoc(pid)];
    return d && d.answers ? d.answers : {};
  }
  function practiceMissing(pid) {
    var a = practiceAnswers(pid);
    return DATA.questions.filter(function (q) { return !valid(DATA.allowed.questions[q.id], a[q.id]); });
  }
  function practiceAnswered(p) { return practiceMissing(p.id).length === 0; }
  function practiceMatched(p) {
    var a = practiceAnswers(p.id);
    return DATA.questions.every(function (q) { return a[q.id] === p.expected[q.id]; });
  }
  function practiceOpen() { return !DATA.practice.items.every(practiceAnswered); }
  function groupDone(g) { return familiarity(g) !== undefined && groupItems(g).every(function (i) { return itemDone(i.id); }); }

  // ── saving: on click, one write at a time per document ────────────────────────────────────
  function write(key, coll, docId, body) {
    state.inflight[key] = (state.inflight[key] || 0) + 1;
    delete state.failed[key];
    var step = function () { return db.collection(coll).doc(docName(docId)).set(body); };
    var run = (chains[key] || Promise.resolve()).then(step, step);
    chains[key] = run.then(function () {
      state.inflight[key] -= 1;
      if (!state.inflight[key]) { delete state.mine[key]; delete state.mineWhy[key]; }
      render();
    }, function (e) {
      state.inflight[key] -= 1;
      if (!state.inflight[key]) { delete state.mine[key]; delete state.mineWhy[key]; } // a refused answer must not count as given
      state.failed[key] = (e && e.code) || "unavailable";
      render();
    });
  }
  function canWrite() {
    return db && state.loaded.answers && state.loaded.groups && state.loaded.practice && state.store === "ok" &&
      (!ASKS_WHO || state.who !== null);
  }
  // An answer that asks why is not written while its reason is empty (#380): it waits on the page, and
  // the store keeps what it had, so an export never meets an answer without the reason it needs. Every
  // write leaves out each such answer, not only the one just picked: on a page of several questions the
  // next answer would otherwise carry the waiting one into the store without its reason.
  // A waiting answer that replaces a saved one leaves the saved one in the write until its reason comes.
  // A stored answer to a question this page no longer asks (removed or renamed between builds) is kept
  // as it was and never checked: the page has no question to check it against.
  function resolved(answers, reasons, saved) {
    var out = {}, waiting = false;
    Object.keys(answers).forEach(function (q) {
      var asked = questionOf(q);
      if (!(asked && needsWhy(asked, answers[q]) && !(reasons[q] || "").trim())) out[q] = answers[q];
      else {
        waiting = true;
        if (Object.prototype.hasOwnProperty.call(saved, q)) out[q] = saved[q];
      }
    });
    return { ready: out, waiting: waiting };
  }
  // What the store holds for an item, or what this page last wrote to it ahead of the store.
  function savedOf(id) {
    if (state.mine[id]) return state.mine[id];
    var d = state.answers[id];
    return d && d.answers ? d.answers : {};
  }
  function keep(id, next, reasons) {
    var r = resolved(next, reasons, savedOf(id)), ready = r.ready;
    if (r.waiting) state.pending[id] = next;
    else delete state.pending[id];
    delete state.refusedWhy[id];
    state.mine[id] = ready;
    var body = { answers: ready, reasons: reasons, savedAt: new Date().toISOString(), source: "page" };
    if (MIN_SECONDS) body.seconds = secondsOf(id);
    write(id, "answers", id, body);
    render();
  }
  function answer(id, qid, value) {
    if (!canWrite() || locked(id)) return;
    var next = Object.assign({}, answersOf(id));
    next[qid] = value;
    state.lastAnswered = id;
    var draft = draftOf(id, qid);
    var why = draft !== undefined ? draft : reasonsOf(id)[qid] || "";
    if (needsWhy(questionOf(qid), value) && !why.trim()) {
      state.pending[id] = next;
      render();
      return;
    }
    var reasons = Object.assign({}, reasonsOf(id));
    if (why.trim()) reasons[qid] = why;
    keep(id, next, reasons);
  }
  // A reason saves when the labeller leaves the box (the text equivalent of a tap); an empty one is refused.
  function setReason(id, qid, text) {
    clearTimeout(state.whyTimers[id + "|" + qid]);
    delete state.whyTimers[id + "|" + qid];
    if (!canWrite()) return;
    var a = answersOf(id);
    if (needsWhy(questionOf(qid), a[qid]) && !text.trim()) {
      state.refusedWhy[id] = true;
      render();
      return;
    }
    var why = Object.assign({}, reasonsOf(id));
    why[qid] = text;
    state.mineWhy[id] = why;
    keep(id, Object.assign({}, a), why);
  }
  // The first answer to a practice question is the one scored: it cannot be changed afterwards.
  function answerPractice(pid, qid, value) {
    if (!canWrite()) return;
    var cur = practiceAnswers(pid);
    if (valid(DATA.allowed.questions[qid], cur[qid])) return;
    var next = Object.assign({}, cur);
    next[qid] = value;
    state.mine["practice:" + pid] = next;
    write("practice:" + pid, "practice", practiceDoc(pid),

        });
        note.appendChild(ul);
      }
      progress.appendChild(note);
    }
    groups.forEach(function (g) {
      var typingHere = groupItems(g.id).some(function (i) { return i.id === state.typingIn || i.id === state.lastAnswered; });
      if (onlyOpen && groupDone(g.id) && !typingHere) return;
      app.appendChild(groupBlock(g, off, onlyOpen));
    });
  }

  // ── the store: subscribe once per collection; render without it, light up when it arrives ──
  function take(target, loadedKey) {
    return function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { next[d.id] = d.data(); });
      state.raw[target] = next;
      state[target] = mineOf(next);
      state.loaded[loadedKey] = true;
      render();
    };
  }
  function broken() { state.store = "none"; render(); }

  // Hidden: every clock stops. Back: the cards are watched afresh, because a change of tab alone
  // fires no intersection, and a card drawn while the tab was hidden never started its clock.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") {
      flushReasons();
      Object.keys(state.seenSince).forEach(stopClock);
    } else if (MIN_SECONDS) watchCards();
  });
  if (MIN_SECONDS) tick();
  window.addEventListener("pagehide", flushReasons);
  render();
  if (!window.claude || typeof window.claude.use !== "function") { broken(); return; }
  window.claude.use("db").then(function (store) {
    if (!store) { broken(); return; }
    db = store;
    state.store = "ok";
    db.collection("answers").onSnapshot(take("answers", "answers"), broken);
    db.collection("groups").onSnapshot(take("groups", "groups"), broken);
    db.collection("practice").onSnapshot(take("practice", "practice"), broken);
  }, broken);
})();
</script>
