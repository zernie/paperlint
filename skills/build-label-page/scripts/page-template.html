<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap">
<style>
/* One look, dark whatever the viewer's theme (Material Ocean, no purple): every color is a token below.
   One column, sections apart by a hairline and wide space; each item a bordered panel with wide space after
   it, and the only raised block inside it the question being asked. Answer buttons are full-width rows with space between them, so a thumb cannot
   land between two of them, and the chosen one has a 2px accent border. */
:root {
  color-scheme: dark;
  --bg: #0f111a; --surface: #1a1c25; --line: #262a3a; --text: #a6accd; --muted: #7e84a3;
  --strong: #eeffff; --accent: #82aaff; --good: #c3e88d; --mark: #ffcb6b; --bad: #f07178;
  --mark-bg: rgba(255, 203, 107, 0.08);
  --sans: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gap-section: 48px; --gap-item: 16px; --measure: 68ch;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.6; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column;
  gap: var(--gap-section); overflow-wrap: anywhere; }
main > * + section, main > section + * { border-top: 1px solid var(--line); padding-top: var(--gap-section); }
header.top { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 1.5rem; line-height: 1.3; margin: 0; color: var(--strong); font-weight: 700; }
h2 { font-size: 1.15rem; line-height: 1.4; margin: 0; color: var(--strong); font-weight: 500; }
p { margin: 0; max-width: var(--measure); }
.muted { color: var(--muted); }
.id { font-family: var(--mono); color: var(--muted); }
section { display: flex; flex-direction: column; gap: var(--gap-item); }
.item { display: flex; flex-direction: column; gap: 20px; padding: var(--gap-item);
  border: 1px solid var(--line); border-radius: 14px; }
.item + .item { margin-top: 24px; }
/* The evidence of a card: one labelled row per field, the label a short word above its content. The two
   readings sit in the same place on every card: A on a solid accent rule, B on a dashed one. */
.row { display: flex; flex-direction: column; gap: 4px; }
.lbl { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.reading { border-left: 3px solid var(--accent); padding-left: 12px; }
.reading.b { border-left: 3px dashed var(--text); }
mark { background: transparent; color: var(--mark); font-weight: 500; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; }
.q { color: var(--strong); font-weight: 500; }
.body { color: var(--strong); }
h3 { font-size: 1rem; margin: 0; color: var(--strong); font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; text-align: left; width: 100%; }
button[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--strong); padding: 9px 15px; }
.opts button { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: start; }
.opts button .icon { grid-row: span 2; font-size: 1.25rem; line-height: 1.6; }
.opts button .label { color: var(--strong); font-weight: 500; grid-column: 2; }
.opts button .ex { color: var(--muted); grid-column: 2; }
.opts button[aria-pressed="true"] { background: var(--surface); }
textarea.why { font: inherit; color: var(--strong); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-height: 88px; width: 100%; }
pre.code .line { display: flex; gap: 0; white-space: pre; min-height: 1.4em; }
pre.code .ws { color: var(--muted); }
pre.code .len { margin-left: auto; padding-left: 16px; color: var(--muted); font-size: 0.85em; user-select: none; }
code { font-family: var(--mono); font-size: 0.92em; color: var(--strong); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
button:disabled { opacity: 0.5; cursor: default; }
.answered { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
.answered button { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; }
.examples { display: flex; flex-direction: column; gap: 12px; }
.example b { color: var(--strong); font-weight: 500; display: block; }
.quote, .banner { background: var(--mark-bg); border-left: 2px solid var(--mark); padding: 10px 14px;
  border-radius: 0 8px 8px 0; color: var(--text); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--good); }
.tabs { display: flex; gap: 24px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { width: auto; border: 0; border-radius: 0; padding: 10px 0; min-height: 44px; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--strong); border: 0; border-bottom: 2px solid var(--accent);
  padding: 10px 0; }
ul { margin: 0; padding-left: 1.2rem; }
pre { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; font-family: var(--mono); font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
  margin: 0; }
.status { color: var(--muted); }
.status.saved::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--good); margin-right: 8px; vertical-align: middle; }
.status.missing { color: var(--mark); }
.status.failed { color: var(--bad); }
/* The content blocks (#380, #392): a code excerpt with its line numbers, hidden ranges as ⋮ rows, an
   optional extra gutter column and the marked line lit, with a review-style note under it; references,
   lists and tables shown in place, never folded. A long text shows three lines and a «more». */
a { color: var(--accent); }
summary { cursor: pointer; color: var(--accent); min-height: 44px; display: flex; align-items: center; gap: 8px; }
.situation { color: var(--strong); font-weight: 500; }
.path { font-size: 0.8rem; color: var(--muted); }
.path code, .anno code, .src code, blockquote.quote code, .opts .sub code { background: transparent; border: 0;
  padding: 0; }
pre.numbered { white-space: normal; padding: 8px 0; font-size: 12px; line-height: 1.45; border-radius: 12px; }
pre.numbered .line { display: grid; grid-template-columns: 7ch 1fr; white-space: pre-wrap; padding: 0 10px 0 0; }
pre.numbered.gutter .line { grid-template-columns: 7ch 5ch 1fr; }
pre.numbered .c { color: var(--accent); text-align: center; font-weight: 500; user-select: none; }
pre.numbered .hdr .c { font-family: var(--sans); font-size: 10px; color: var(--muted); font-weight: 400; }
/* The marked line reads as marked without its colour: a marker before its number, and a label after
   the code or the note under it. */
pre.numbered .this { color: var(--mark); font-weight: 700; margin-left: 1ch; white-space: nowrap; user-select: none; }
pre.numbered .n { color: var(--muted); text-align: right; padding-right: 1.5ch; user-select: none; }
pre.numbered .ctx .t, pre.numbered .gap .t { color: var(--muted); }
pre.numbered .gap .t { font-family: var(--sans); font-size: 11px; }
pre.numbered .hit { background: var(--mark-bg); box-shadow: inset 3px 0 0 var(--mark); }
pre.numbered .hit .n, pre.numbered .hit .t { color: var(--mark); }
.anno { position: relative; margin: 7px 8px 5px; padding: 6px 10px; border: 1px solid var(--accent); border-radius: 8px;
  background: var(--bg); font-family: var(--sans); font-size: 14px; line-height: 1.4; color: var(--strong);
  white-space: normal; }
.anno-arrow { position: absolute; top: -6px; left: 30px; width: 10px; height: 10px; background: var(--bg);
  border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg); }
/* The words a card asks about, as a quote, with their source as a small line under them. */
blockquote.quote { margin: 0; font-size: 1.1rem; line-height: 1.4; color: var(--strong); font-weight: 500;
  background: transparent; border: 0; padding: 0; }
.src { color: var(--muted); font-size: 0.9rem; }
.opts button .sub { color: var(--muted); grid-column: 2; font-size: 0.8rem; line-height: 1.3; }
.ask .gate { background: var(--accent); color: var(--bg); opacity: 0.45; border-radius: 10px; min-height: 44px;
  display: flex; align-items: center; justify-content: center; font-weight: 500; text-align: center; padding: 6px 12px; }
/* A term with a note: dotted underline; a tap (or hover, where there is hover) opens one floating note. */
button.term { display: inline; width: auto; min-height: 0; padding: 0; margin: 0; border: 0; border-radius: 0;
  background: none; font: inherit; color: inherit; text-align: inherit; border-bottom: 1px dotted var(--accent); }
button.term[aria-expanded="true"] { border-bottom-style: solid; color: var(--strong); padding: 0; }
button.term code { background: transparent; border: 0; padding: 0; }
#tip { position: absolute; z-index: 10; width: max-content; max-width: 280px; background: var(--surface);
  border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; line-height: 1.45;
  color: var(--text); font-family: var(--sans); }
#tip.snip { max-width: 300px; }
#tip p + p, #tip pre + p { margin-top: 6px; }
#tip a { font-size: 12px; }
#tip b, #tip q { color: var(--strong); font-weight: 500; }
#tip pre { margin: 0; padding: 0; border: 0; background: none; font-size: 10px; line-height: 1.45; white-space: pre;
  overflow-x: auto; color: var(--strong); }
#tip .tip-arrow { position: absolute; width: 10px; height: 10px; background: var(--surface); transform: rotate(45deg); }
#tip.below .tip-arrow { top: -6px; border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); }
#tip.above .tip-arrow { bottom: -6px; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
/* A source tag (#400): a small pill right above the block it names. The colour is the id's place in the
   page's `sources`, one of five tokens of :root; text and edge are the colour, the fill a faint wash of it. */
.tagged { display: flex; flex-direction: column; gap: 6px; }
.tag { align-self: flex-start; font-size: 0.7rem; line-height: 1.2; letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 500; padding: 3px 9px; border-radius: 999px; color: var(--tag); border: 1px solid var(--tag);
  background: color-mix(in srgb, var(--tag) 14%, var(--bg)); }
.tag.s0 { --tag: var(--accent); } .tag.s1 { --tag: var(--good); } .tag.s2 { --tag: var(--mark); }
.tag.s3 { --tag: var(--bad); } .tag.s4 { --tag: var(--text); }
.rulebox { display: flex; flex-direction: column; gap: 8px; }
.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* The clamp cuts at the padding box, so a code block's bottom padding is a border: no fourth line peeks in. */
pre.clamped { padding-bottom: 0; border-bottom: 10px solid var(--surface); box-shadow: 0 1px 0 var(--line); }
button.more { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; align-self: flex-start; }
.setting { display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.match.yes { color: var(--good); }
.match.no { color: var(--bad); }
.who { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
.who button { width: auto; min-height: 44px; border: 0; color: var(--accent); padding: 0 4px; }
/* The language switch: small buttons side by side under the title, the picked one pressed. */
.langs { display: flex; gap: 8px; }
.langs button { width: auto; min-width: 56px; min-height: 44px; text-align: center; }
</style>
<main id="app"><p class="muted">Loading…</p></main>
<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var app = document.getElementById("app");
  var state = {
    answers: {},      // item id -> {answers, savedAt, source}, from the store
    groups: {},       // group id -> {familiarity, savedAt, source}
    practice: {},     // r<round>-P<n> -> {answers, savedAt, source}; the FIRST answer, kept apart
    editing: {},      // item id -> the question id the labeller tapped "Change" on
    mineWhy: {},      // item id -> the reasons this page has just written (ahead of the store)
    draftWhy: {},     // item id -> {question id: text typed and not yet saved}
    whyTimers: {},    // "<item id>|<question id>" -> the pending save of a reason being typed
    whyBoxes: {},     // "<item id>|<question id>" -> the reason box of the last render
    typingIn: null,   // the item whose reason box has the keyboard: shown even when complete
    lastAnswered: null, // the item answered last: shown under "Next unanswered" until the next answer
    pending: {},      // item id -> answers chosen whose reason is still empty: NOT in the store
    refusedWhy: {},   // item id -> true when an empty reason was refused for its answer
    mine: {},         // item/group key -> the answers this page has just written (ahead of the store)
    inflight: {},     // item/group key -> writes not yet confirmed
    failed: {},       // item/group key -> error code of the last refused write
    loaded: { answers: false, groups: false, practice: false },
    store: "loading", // loading | ok | none
    filter: "all",
    who: null,        // the answerer picked, on a page with DATA.answerers; null until one is
    raw: { answers: {}, groups: {}, practice: {} }, // every document of the store, every answerer's
    dwell: {},        // item id -> ms its card was on screen, clocks stopped (DATA.min_seconds)
    seenSince: {},    // item id -> when its card came on screen, while it is
    firstSeconds: {}, // item id -> the seconds this page stored with the item's first save
    gates: {}         // item id -> the locked buttons and the countdown of the last render
  };
  var db = null;
  var chains = {};
  var WHY_PAUSE_MS = 800;

  try { if (localStorage.getItem("label-filter") === "next") state.filter = "next"; } catch (e) {}
  var BASE = { title: DATA.title, intro: DATA.intro, labels: DATA.labels, questions: DATA.questions };
  // ── the page's own words, in the language picked (DATA.translations, #394) ─────────────────
  // Only the page's words change: the quote, the code and every note on a card stay as built.
  var LANGS = DATA.translations ? [DATA.lang].concat(Object.keys(DATA.translations)) : [];
  state.lang = DATA.lang || "en";
  try {
    var said = localStorage.getItem("label-lang");
    if (LANGS.indexOf(said) !== -1) state.lang = said;
  } catch (e) {}
  function words() { return state.lang === DATA.lang || !DATA.translations ? BASE : DATA.translations[state.lang]; }
  function Qs() { return words().questions; }
  function pickLang(lang) {
    state.lang = lang;
    try { localStorage.setItem("label-lang", lang); } catch (e) {}
    render();
  }
  // One button per language, its tag on it ("EN", "RU"); the one picked is pressed.
  function langSwitch() {
    var row = mark(el("div", "langs"), "lang-switch", { lang: state.lang, langs: LANGS });
    LANGS.forEach(function (lang) {
      var b = mark(el("button", "", lang.toUpperCase()), "lang-option", { lang: lang });
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.lang === lang));
      b.addEventListener("click", function () { pickLang(lang); });
      row.appendChild(b);
    });
    return row;
  }
  // ── who is answering (DATA.answerers): each answerer's documents are "<answerer>~<id>" ─────
  // "~" is outside the build's name pattern, so no answerer, item, group or practice id holds it.
  var SEP = "~";
  var ANSWERERS = DATA.answerers || [];
  var ASKS_WHO = ANSWERERS.length > 0;
  try {
    var remembered = localStorage.getItem("label-answerer");
    if (ANSWERERS.indexOf(remembered) !== -1) state.who = remembered;
  } catch (e) {}
  // The store's id of one of this page's documents: as before on a page without answerers.
  function docName(id) { return ASKS_WHO ? state.who + SEP + id : id; }
  // The documents of the current answerer, by their names without the answerer.
  function mineOf(docs) {
    if (!ASKS_WHO) return docs;
    var out = {}, prefix = state.who + SEP;
    if (state.who) Object.keys(docs).forEach(function (k) { if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = docs[k]; });
    return out;
  }
  // The items shown to the current answerer: an item's own `answerers`, else everyone's.
  function itemsShown() {
    return DATA.items.filter(function (i) { return !i.answerers || i.answerers.indexOf(state.who) !== -1; });
  }
  function groupsShown() { return DATA.groups.filter(function (g) { return groupItems(g.id).length > 0; }); }
  function busy() {
    return Object.keys(state.inflight).some(function (k) { return state.inflight[k] > 0; }) || Object.keys(state.whyTimers).length > 0;
  }
  // Picking (or switching) the answerer: everything this page holds of the last one is dropped.
  function choose(name) {
    if (busy()) return;
    Object.keys(state.seenSince).forEach(stopClock);
    state.who = name;
    try {
      if (name) localStorage.setItem("label-answerer", name);
      else localStorage.removeItem("label-answerer");
    } catch (e) {}
    ["editing", "mineWhy", "draftWhy", "pending", "refusedWhy", "mine", "failed", "dwell", "seenSince", "firstSeconds"]
      .forEach(function (k) { state[k] = {}; });
    state.lastAnswered = null;
    ["answers", "groups", "practice"].forEach(function (c) { state[c] = mineOf(state.raw[c]); });
    render();
  }
  // ── how long a card was on screen (DATA.min_seconds): its answer saves only after that long ──
  // On screen: half the card in view, or half the viewport filled by a card taller than it.
  var MIN_SECONDS = DATA.min_seconds || 0;
  function dwellMs(id) {
    var ms = state.dwell[id] || 0;
    return state.seenSince[id] !== undefined ? ms + Date.now() - state.seenSince[id] : ms;
  }
  function stopClock(id) {
    if (state.seenSince[id] === undefined) return;
    state.dwell[id] = dwellMs(id);
    delete state.seenSince[id];
  }
  function startClock(id) { if (state.seenSince[id] === undefined) state.seenSince[id] = Date.now(); }
  // An item already saved (by this page or in the store) is never locked again.
  function unsaved(id) { return !state.answers[id] && state.firstSeconds[id] === undefined; }
  function locked(id) { return MIN_SECONDS > 0 && unsaved(id) && dwellMs(id) < MIN_SECONDS * 1000; }
  function waitSeconds(id) { return Math.ceil((MIN_SECONDS * 1000 - dwellMs(id)) / 1000); }
  function waitText(id) { return fill(words().labels.wait, { s: waitSeconds(id) }); }
  // The seconds stored with an item: those of its first save, kept on every later write.
  function secondsOf(id) {
    var d = state.answers[id];
    if (d && typeof d.seconds === "number") return d.seconds;
    if (state.firstSeconds[id] === undefined) state.firstSeconds[id] = Math.floor(dwellMs(id) / 1000);
    return state.firstSeconds[id];
  }
  // An observer reports only when a card crosses one of its thresholds, so each card gets its own
  // observer whose threshold is that card's share: half the card, or half the viewport for a card
  // taller than it. The share follows the card's height and the viewport's: a card that changes
  // size, or a resized window, is watched again with its new share.
  var observers = [];
  var sizes = null;
  function share(h) { return h > 0 ? Math.min(h, window.innerHeight) / 2 / h : 0.5; }
  function onScreen(entry) {
    var h = entry.boundingClientRect.height;
    return entry.isIntersecting && h > 0 &&
      entry.intersectionRect.height >= Math.min(h, window.innerHeight) / 2 - 0.5;
  }
  function watchCard(card) {
    var id = card.getAttribute("data-id");
    var o = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (onScreen(e) && document.visibilityState !== "hidden") startClock(id);
        else stopClock(id);
      });
    }, { threshold: [0, share(card.getBoundingClientRect().height)] });
    o.observe(card);
    return o;
  }
  // Every render draws new cards: the clocks stop, and the new cards are watched from scratch.
  function watchCards() {
    observers.forEach(function (o) { o.disconnect(); });
    observers = [];
    if (sizes) sizes.disconnect();
    sizes = null;
    var cards = Array.prototype.slice.call(document.querySelectorAll("article.item[data-id]"));
    if (typeof IntersectionObserver !== "function") {
      // No way to tell what is in view: a card counts as on screen from the moment it is drawn.
      cards.forEach(function (c) { startClock(c.getAttribute("data-id")); });
      return;
    }
    observers = cards.map(watchCard);
    if (typeof ResizeObserver !== "function") return;
    var heights = cards.map(function (c) { return c.getBoundingClientRect().height; });
    sizes = new ResizeObserver(function (entries) {
      entries.forEach(function (e) {
        var i = cards.indexOf(e.target);
        var h = e.target.getBoundingClientRect().height;
        if (i === -1 || Math.abs(h - heights[i]) < 1) return;
        heights[i] = h;
        observers[i].disconnect();
        observers[i] = watchCard(cards[i]);
      });
    });
    cards.forEach(function (c) { sizes.observe(c); });
  }
  // The countdown on each locked card, and its buttons let go when its time is up; no render, so
  // a section the labeller opened stays open.
  function tick() {
    Object.keys(state.gates).forEach(function (id) {
      var g = state.gates[id];
      if (locked(id)) {
        g.note.textContent = waitText(id);
        g.note.setAttribute("data-test-meta", JSON.stringify({ id: id, seconds: waitSeconds(id) }));
        return;
      }
      if (g.note.parentNode) g.note.parentNode.removeChild(g.note);
      g.buttons.forEach(function (b) { b.disabled = !canWrite(); });
      delete state.gates[id];
    });
    setTimeout(tick, 250);
  }

  // ── what "done" means ────────────────────────────────────────────────────────────────────
  function answersOf(id) {
    return state.pending[id] || savedOf(id);
  }
  // A stored value is an answer only if the build offers it (DATA.allowed, the same lists the
  // export reads from key.json): after a rebuild that removed an option, or a typo merged from chat,
  // the question is unanswered again and says so.
  function valid(allowed, v) { return allowed.indexOf(v) !== -1; }
  function reasonsOf(id) {
    if (state.mineWhy[id]) return state.mineWhy[id];
    var d = state.answers[id];
    return d && d.reasons ? d.reasons : {};
  }
  function keepDraft(id, qid, text) {
    state.draftWhy[id] = Object.assign({}, state.draftWhy[id] || {});
    state.draftWhy[id][qid] = text;
  }
  // The text typed for a reason and not yet in the store; a draft the store now holds is done.
  function draftOf(id, qid) {
    var d = state.draftWhy[id];
    if (!d || !Object.prototype.hasOwnProperty.call(d, qid)) return undefined;
    var stored = state.answers[id] && state.answers[id].reasons;

    p.appendChild(mark(link(e.url_label, e.url), "tip-link", { url: e.url }));
    return out.concat([p]);
  }
  // Below the term if it fits, else above; inside the viewport sideways; the arrow points at the term.
  function openTip(b) {
    closeTip();
    if (!tip) {
      tip = document.body.appendChild(el("div"));
      tip.id = "tip";
      tip.setAttribute("role", "tooltip");
    }
    tipAt = b;
    tipTerm = JSON.parse(b.getAttribute("data-test-meta")).term;
    b.setAttribute("aria-expanded", "true");
    var note = tips[b.getAttribute("data-tip")];
    tip.textContent = "";
    note.forEach(function (e) { tipEntry(e).forEach(function (n) { tip.appendChild(n); }); });
    var arrow = tip.appendChild(el("span", "tip-arrow"));
    tip.className = note.some(function (e) { return e.code; }) ? "snip" : "";
    tip.hidden = false;
    tipMeta(true);
    var r = b.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), vw - w - 8);
    var below = r.bottom + h + 12 < window.innerHeight || r.top < h + 12;
    tip.className += below ? " below" : " above";
    tip.style.left = (x + window.scrollX) + "px";
    tip.style.top = ((below ? r.bottom + 8 : r.top - h - 8) + window.scrollY) + "px";
    arrow.style.left = Math.min(Math.max(10, r.left + r.width / 2 - x - 5), w - 20) + "px";
  }
  // A tap opens the term's note, or closes it when it is open; a tap on a note opened by hover keeps it.
  function tapTerm(b) {
    if (b !== tipAt) openTip(b);
    else if (hovered) hovered = false;
    else closeTip();
  }
  // A tap outside the note and its term only closes the note: it never reaches the answer under it.
  document.addEventListener("click", function (e) {
    if (!tipAt || !e.target.closest || e.target.closest("button.term, #tip")) return;
    closeTip();
    e.preventDefault();
    e.stopPropagation();
  }, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeTip(); });
  // A note opened by hover closes a moment after the pointer leaves its term and the note: the gap
  // between them must be crossable. Entering the term or the note again keeps it.
  document.addEventListener("mouseover", function (e) {
    if (!hovered || !tipAt || !e.target.closest) return;
    if (e.target.closest("button.term, #tip")) stayTip();
    else if (leaving === null) leaving = setTimeout(function () { leaving = null; if (hovered) closeTip(); }, graceMs());
  });
  // After a render the note follows its term's new button, or closes when the term is gone.
  function reanchorTip() {
    if (!tipAt) return;
    var key = tipAt.getAttribute("data-tip"), wasHover = hovered;
    var again = app.querySelector('button.term[data-tip="' + key + '"]');
    if (again) { openTip(again); hovered = wasHover; } else closeTip();
  }
  // The words a card asks about, as a quote, and their source as a small line under them.
  function quoteBlock(item, ctx) {
    var box = el("div", "rulebox");
    var bq = box.appendChild(mark(el("blockquote", "quote"), "quote"));
    termed(bq.appendChild(el("q")), item.quote.text, ctx, "quote");
    if (item.quote.source) termed(box.appendChild(mark(el("p", "src"), "quote-source")), item.quote.source, ctx, "source");
    return box;
  }
  // A reference entry: its title, then each field (a paragraph, a code block on a labelled row, or a
  // quiet note), then its link.
  function referenceBlock(r) {
    var box = el("div", "rulebox");
    box.appendChild(rich("p", "", r.title));
    r.fields.forEach(function (f) {
      if (f.style === "note") box.appendChild(el("p", "muted", f.text));
      else if (f.style === "code") box.appendChild(row(f.label || "", clamp(plainCode(f.text), f.text)));
      else box.appendChild(clamp(rich("p", "", (f.label ? f.label + ": " : "") + f.text), f.text));
    });
    if (r.url) box.appendChild(el("p")).appendChild(link(r.url_label || r.url, r.url));
    return box;
  }
  // A block of a card's reference material, in place under its heading: nothing a card needs is
  // folded away (#392).
  function shownBlock(summary) {
    var d = el("div", "rulebox");
    d.appendChild(el("h3", "", summary));
    return d;
  }
  function references(x) {
    var d = shownBlock(x.summary);
    x.entries.forEach(function (r) { d.appendChild(row(r.label || "", referenceBlock(r))); });
    return d;
  }
  function moreList(m) {
    var d = shownBlock(m.summary);
    var ul = el("ul");
    m.items.forEach(function (f) { ul.appendChild(rich("li", "", f)); });
    if (m.rest) ul.appendChild(el("li", "muted", m.rest));
    d.appendChild(ul);
    return d;
  }
  // A table: its note, then each row in the order given: label, value as code, plain words, mark.
  function table(t) {
    var d = shownBlock(t.summary);
    if (t.note) d.appendChild(el("p", "muted", t.note));
    t.rows.forEach(function (r) {
      var s = el("div", "setting");
      s.appendChild(el("span", "lbl", r.label));
      s.appendChild(el("p")).appendChild(el("code", "", r.value));
      if (r.plain) s.appendChild(rich("p", "", r.plain));
      if (r.mark) s.appendChild(el("p", "match " + r.mark.tone, r.mark.text));
      d.appendChild(s);
    });
    return d;
  }
  // Below the question and its answers: the references, the list of more like it and the table, in
  // place, so the question sits right under the code it names.
  function blocksBelow(card, item) {
    if (item.references) card.appendChild(references(item.references));
    if (item.more) card.appendChild(moreList(item.more));
    if (item.table) card.appendChild(table(item.table));
  }
  // What a card shows above its question, one labelled row per field (an item and a practice item alike).
  // A card's quote comes first, under its title: the words asked about, then the code they are about.
  function evidence(card, item, ctx) {
    if (item.title) card.appendChild(rich("h3", "", item.title));
    if (item.quote) card.appendChild(tagged(quoteBlock(item, ctx), item.quote.from, "quote"));
    if (item.body !== undefined) {
      var body = rich("p", "body", item.body);
      card.appendChild(words().labels.body ? row(words().labels.body, body) : body);
    }
    if (item.repeat && item.repeat.of > 1) card.appendChild(el("p", "muted", fill(words().labels.repeat, item.repeat)));
    if (item.code) card.appendChild(codeBlock(item.code));
    if (item.unit) card.appendChild(row(item.unit.of > 1 ? fill(words().labels.line_part, { line: words().labels.line, part: item.unit.part, of: item.unit.of }) : words().labels.line,
      markedLine(item.unit)));
    // A rule the item names, with what it does in the linter's own words (looked up at build time).
    (item.rules || []).forEach(function (r) {
      card.appendChild(row("Rule", rich("p", "", r.linter + " `" + r.id + "`" + (r.family ? " (" + r.family + ")" : "") + ": " + r.description)));
    });
    if (item.readings) {
      card.appendChild(row("Reading A", rich("p", "", item.readings.a), "reading a"));
      card.appendChild(row("Reading B", rich("p", "", item.readings.b), "reading b"));
    }
    if (item.file) card.appendChild(row("File", rich("p", "", item.file)));
    if (item.context) card.appendChild(rich("p", "muted", item.context));
    if (item.situation && item.situation.summary) card.appendChild(tagged(situated("p", "situation", item.situation.summary, item.situation.line), item.situation.from, "situation"));
    if (item.excerpt) card.appendChild(tagged(excerptBlock(item.excerpt, ctx), item.excerpt.from, "excerpt"));
  }
  function labelOf(q, v) {
    var o = q.options.filter(function (x) { return x.value === v; })[0];
    return o ? o.label : v;
  }
  // A card's own wording of the first question, or the translation's, with `{n}` its marked line's number.
  function situationQuestion(item) {
    var own = words().situation_question;
    if (own === undefined) return situated("p", "q", item.situation.question, item.situation.line);
    var hit = item.excerpt && item.excerpt.lines.filter(function (l) { return l.mark; })[0];
    var line = hit ? { n: hit.n, text: hit.text.trim() } : null;
    return situated("p", "q", line ? fill(own, { n: line.n }) : own, line);
  }
  // One question per screen: the answered ones stay as a line (with "Change"), and only one question
  // is asked: the one being changed, else the first unanswered.
  function askOne(card, a, editing, onPick, onChange, off, withExamples, item) {
    var open = Qs().filter(function (q) { return !valid(DATA.allowed.questions[q.id], a[q.id]); });
    var asked = Qs().filter(function (q) { return q.id === editing; })[0] || open[0];
    var situation = item.situation, notes = item.answer_notes || {};
    Qs().forEach(function (q) {
      if (q === asked || !valid(DATA.allowed.questions[q.id], a[q.id])) return;
      var line = el("p", "answered", (q.short || q.text) + ": " + labelOf(q, a[q.id]) + " ");
      if (onChange) {
        var b = el("button", "", "Change");
        b.type = "button";
        b.disabled = off;
        b.addEventListener("click", function () { onChange(q); });
        line.appendChild(b);
      }
      card.appendChild(line);
    });
    if (!asked) return null;
    var ask = el("div", "ask");
    // A card's situation asks the page's first question in its own words; the others keep theirs.
    ask.appendChild(mark(situation && asked === Qs()[0] ? situationQuestion(item) : rich("p", "q", asked.text),
      "question", { question: asked.id }));
    ask.appendChild(options(asked.options, a[asked.id], function (v) { onPick(asked, v); }, off, withExamples, notes[asked.id], asked.id));
    card.appendChild(ask);
    return ask;
  }
  // Open until the practice is done; then folded into a toggle, so the cards start near the top.
  function howTo() {
    var sec = el("section");
    var body = sec;
    var heading = words().labels.how_to;
    if (practiceOpen()) sec.appendChild(el("h2", "", heading));
    else {
      body = sec.appendChild(el("details"));
      body.appendChild(el("summary", "", heading));
    }
    Qs().forEach(function (q) {
      body.appendChild(mark(el("p", "q", q.text), "how-to-question", { question: q.id }));
      var list = el("div", "examples");
      q.options.forEach(function (o) {
        var row = mark(el("div", "example"), "how-to-answer", { question: q.id, value: o.value });
        row.appendChild(el("b", "", (o.icon ? o.icon + " " : "") + o.label));
        row.appendChild(rich("span", "muted", words().labels.for_example + o.example));
        list.appendChild(row);
      });
      body.appendChild(list);
    });
    return sec;
  }
  function practiceCard(p, off) {
    var card = mark(el("article", "item"), "practice-item", { id: p.id });
    card.appendChild(el("div", "id", "Practice " + p.id));
    var ctx = termsOf(p);
    evidence(card, p, ctx);
    var a = practiceAnswers(p.id);
    askOne(card, a, undefined, function (q, v) { answerPractice(p.id, q.id, v); }, null, off, true, p);
    if (practiceAnswered(p)) {
      var expected = Qs().map(function (q) { return labelOf(q, p.expected[q.id]); }).join(" · ");
      card.appendChild(rich("p", practiceMatched(p) ? "status saved" : "quote",
        (practiceMatched(p) ? "Matched. " : "Not matched. Expected: " + expected + ". ") + p.why));
    }
    card.appendChild(statusLine("practice:" + p.id, [], null));
    blocksBelow(card, p);
    return card;
  }
  function practiceBlock(off) {
    var items = DATA.practice.items;
    var sec = el("section");
    if (practiceOpen()) {
      var answered = items.filter(practiceAnswered).length;
      sec.appendChild(el("h2", "", "🎯 Practice: " + answered + " of " + items.length + " answered"));
      sec.appendChild(el("p", "muted", "These answers are known. After each one the page shows the expected " +
        "answer. The real items open when all " + items.length + " are answered."));
      items.forEach(function (p) { sec.appendChild(practiceCard(p, off)); });
      return sec;
    }
    var missed = items.filter(function (p) { return !practiceMatched(p); });
    sec.appendChild(el("h2", "", (missed.length ? "⚠️ " : "✅ ") + "Practice: " + (items.length - missed.length) + " of " + items.length + " matched"));
    if (missed.length) {
      sec.appendChild(el("div", "banner", "A practice answer did not match. Before going on, tell the agent " +
        "which one: the question is reworded and you take the practice again."));
      missed.forEach(function (p) { sec.appendChild(practiceCard(p, off)); });
    }
    return sec;
  }
  function groupBlock(g, off, onlyOpen) {
    var sec = el("section");
    sec.appendChild(el("h2", "", g.label));
    if (ASKS_FAMILIARITY) {
      var fam = el("div", "ask");
      fam.appendChild(el("p", "q", DATA.familiarity_question.replace("{group}", g.label)));
      fam.appendChild(options(DATA.familiarity, familiarity(g.id), function (v) { setFamiliarity(g.id, v); }, off));
      var gs = state.groups[g.id];
      fam.appendChild(statusLine("group:" + g.id,
        familiarity(g.id) === undefined ? [{ text: "an answer" }] : [], gs && gs.savedAt));
      sec.appendChild(fam);
    }
    groupItems(g.id).forEach(function (i) {
      if (onlyOpen && itemDone(i.id) && i.id !== state.typingIn && i.id !== state.lastAnswered) return;
      sec.appendChild(itemCard(i, off));
    });
    return sec;
  }
  // Every reason typed and not yet saved goes to the store now: the page is being left.
  function flushReasons() {
    Object.keys(state.whyTimers).forEach(function (k) {
      var at = k.indexOf("|"), id = k.slice(0, at), qid = k.slice(at + 1);
      var draft = draftOf(id, qid);
      if (draft === undefined) { clearTimeout(state.whyTimers[k]); delete state.whyTimers[k]; return; }
      setReason(id, qid, draft);
    });
  }
  // The page is rebuilt on every store snapshot; the reason box being typed in gets the keyboard back,
  // with its caret where it was, or the rest of the sentence goes nowhere.
  // Chrome fires "change" on a focused box while a render is removing it, and that change saves and
  // renders: a render started inside a render would paint with no box focused and hide the item being
  // typed in. It is skipped; the write it started renders again when the store confirms it.
  var painting = false;
  function render() {
    if (painting) return;
    painting = true;
    try { renderOnce(); } finally { painting = false; }
  }
  function renderOnce() {
    var typing = null;
    Object.keys(state.whyBoxes).forEach(function (k) {
      var b = state.whyBoxes[k];
      if (document.activeElement === b) typing = { key: k, start: b.selectionStart, end: b.selectionEnd };
    });
    state.whyBoxes = {};
    // Under "Next unanswered" the save that completes an item would hide it, box and all, mid-sentence:
    // the item being typed in stays on the page until the labeller leaves its box.
    state.typingIn = typing ? typing.key.slice(0, typing.key.indexOf("|")) : null;
    Object.keys(state.seenSince).forEach(stopClock);
    state.gates = {};
    tips = {};
    paint();
    reanchorTip();
    if (MIN_SECONDS) watchCards();
    var again = typing && state.whyBoxes[typing.key];
    if (again) { again.focus(); again.setSelectionRange(typing.start, typing.end); }
  }
  // The answerer's choice, before anything else of the page.
  function whoBlock() {
    var sec = el("section");
    sec.appendChild(el("h2", "", "Who is answering?"));
    sec.appendChild(el("p", "muted", "Each person answers under their own name and sees only their own answers."));
    var row = el("div", "opts");
    ANSWERERS.forEach(function (name) {
      var b = el("button", "", name);
      b.type = "button";
      b.addEventListener("click", function () { choose(name); });
      row.appendChild(b);
    });
    sec.appendChild(row);
    return sec;
  }
  function whoLine() {
    var line = el("p", "who");
    line.appendChild(el("span", "", "Answering as " + state.who));
    var b = el("button", "", "Switch");
    b.type = "button";
    b.disabled = busy();
    b.addEventListener("click", function () { choose(null); });
    line.appendChild(b);
    return line;
  }
  function paint() {
    var off = !canWrite();
    var items = itemsShown(), groups = groupsShown();
    var done = items.filter(function (i) { return itemDone(i.id); }).length;
    var total = items.length;
    app.textContent = "";
    var top = el("header", "top");
    app.appendChild(top);
    try { document.documentElement.lang = state.lang; } catch (e) {}
    top.appendChild(el("h1", "", words().title));
    if (LANGS.length) top.appendChild(langSwitch());
    if (words().intro) top.appendChild(el("p", "muted", words().intro));
    if (state.store === "none") {
      top.appendChild(el("div", "banner",
        "Answers cannot be saved in this view, so it is read-only. Open the page from the claude.ai " +
        "artifact link while signed in with access to answer."));
    } else if (state.store === "loading" || !(state.loaded.answers && state.loaded.groups)) {
      top.appendChild(el("p", "muted", "Loading saved answers…"));
    }
    if (ASKS_WHO && !state.who) { app.appendChild(whoBlock()); return; }
    if (ASKS_WHO) top.appendChild(whoLine());
    app.appendChild(howTo());
    app.appendChild(practiceBlock(off));
    // Without the store nothing can be answered, practice included: show the real items read-only (rule 7).
    if (practiceOpen() && state.store !== "none") return;
    var progress = el("section");
    app.appendChild(progress);
    progress.appendChild(el("p", "", done + " of " + total + " items complete"));
    var bar = el("div", "bar"), fill = el("div");
    fill.style.width = (total ? (100 * done / total) : 0) + "%";
    bar.appendChild(fill);
    progress.appendChild(bar);
    // Done means every item AND every group's familiarity, as «Next unanswered» counts it.
    var rated = groups.every(function (g) { return familiarity(g.id) !== undefined; });
    if (total && done === total && rated && state.filter === "all") {
      progress.appendChild(el("p", "status saved", "All " + total + " items are complete. Tell the agent you are " +
        "done; you can still change any answer."));
    }

    var filters = el("div", "tabs");
    [["all", "All items"], ["next", "Next unanswered"]].forEach(function (f) {
      var b = el("button", "", f[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.filter === f[0]));
      b.addEventListener("click", function () {
        state.filter = f[0];
        try { localStorage.setItem("label-filter", f[0]); } catch (e) {}
        render();
      });
      filters.appendChild(b);
    });
    progress.appendChild(filters);

    var onlyOpen = state.filter === "next";
    if (onlyOpen) {
      var rest = items.filter(function (i) { return !itemDone(i.id); });
      var open = groups.filter(function (g) { return familiarity(g.id) === undefined; });
      var note = el("div", "muted");
      if (!rest.length && !open.length) {
        note.appendChild(el("p", "", "Nothing left. Every item and every group is answered."));
      } else {
        note.appendChild(el("p", "", "Left to do:"));
        var ul = el("ul");
        open.forEach(function (g) { ul.appendChild(el("li", "", g.label + ": how well you know it")); });
        rest.forEach(function (i) {
          ul.appendChild(el("li", "", i.id + " needs " +
            missingFor(i.id).map(function (q) { return q.short || q.text; }).join("; ")));
        });
        note.appendChild(ul);
      }
      progress.appendChild(note);
    }
    groups.forEach(function (g) {
      var typingHere = groupItems(g.id).some(function (i) { return i.id === state.typingIn || i.id === state.lastAnswered; });
      if (onlyOpen && groupDone(g.id) && !typingHere) return;
      app.appendChild(groupBlock(g, off, onlyOpen));
    });
  }

  // ── the store: subscribe once per collection; render without it, light up when it arrives ──
  function take(target, loadedKey) {
    return function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { next[d.id] = d.data(); });
      state.raw[target] = next;
      state[target] = mineOf(next);
      state.loaded[loadedKey] = true;
      render();
    };
  }
  function broken() { state.store = "none"; render(); }

  // Hidden: every clock stops. Back: the cards are watched afresh, because a change of tab alone
  // fires no intersection, and a card drawn while the tab was hidden never started its clock.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") {
      flushReasons();
      Object.keys(state.seenSince).forEach(stopClock);
    } else if (MIN_SECONDS) watchCards();
  });
  window.addEventListener("resize", function () { if (MIN_SECONDS) watchCards(); });
  if (MIN_SECONDS) tick();
  window.addEventListener("pagehide", flushReasons);
  render();
  if (!window.claude || typeof window.claude.use !== "function") { broken(); return; }
  window.claude.use("db").then(function (store) {
    if (!store) { broken(); return; }
    db = store;
    state.store = "ok";
    db.collection("answers").onSnapshot(take("answers", "answers"), broken);
    db.collection("groups").onSnapshot(take("groups", "groups"), broken);
    db.collection("practice").onSnapshot(take("practice", "practice"), broken);
  }, broken);
})();
</script>
