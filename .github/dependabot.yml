# Dependency updates by bot, not by hand.
#
# WHY A BOT AT ALL, not runtime version checks: an update IS AN ACTION,
# and the bot creates a pull request you can press. A terminal line
# saying "something newer exists" is not an action; it gets forgotten in a day. The local gate
# `npm ls vigiles` in the consumer solves a DIFFERENT problem — "installed does not match manifest" —
# and knows nothing about freshness against the registry: measurement 2026-09-16 — manifest `^27.1.4`
# with 27.1.6 and 27.2.0 in the registry gives RC=0, the range is satisfied.
#
# WHY THIS IS ALLOWED HERE, though the bot is off in a neighboring repository: that one is
# PRIVATE, and its runs ate the shared Actions quota. This one is
# public, free-tier minutes are free, so that objection does not apply here. If it becomes private,
# the rule changes with it.
#
# 🔴 WHAT THIS FILE DOES NOT GOVERN, and we have tripped on this: it controls only
# version updates. SECURITY updates are a separate mechanism and a separate
# REPOSITORY SETTING (Settings → Advanced Security), their frequency and
# grouping cannot be changed from here. If single PRs for indirect
# dependencies start appearing — look for the lever there, not in this file.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # MONTHLY. It used to be daily so that new vigiles releases arrived fast, but we bump
    # vigiles by hand in the same pass that merges a vigiles PR, so the bot was only ever
    # catching up with what we had already done. Once a month is the pace someone reads.
    #
    # 🔴 SCHEDULE IS NOT THE ONLY DELAY, and the second one is easy to miss: version
    # updates have a COOLDOWN, defaulting to 3 days — "a new version is not
    # considered for a version update until 3 days after its release". It is NOT
    # removed deliberately: three days is protection against a just-revoked release, and
    # we learn about our own versions before the bot anyway (vigiles is our package, bumped
    # in the same pass where we merge PRs). Net window ~3-4 days.
    #
    # ⚠️ Publishing to the registry does not wake the bot — it runs on schedule only.
    # For immediate check: Insights -> Dependency graph -> Dependabot -> Check for updates.
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Almaty"
    # 🔴 OUR OWN PACKAGE IS EXEMPT FROM COOLDOWN, answering a specific objection:
    # we can release multiple vigiles versions in a day, and a three-day
    # default wait would mean the bot offers yesterday's.
    # The wait exists as protection against a just-revoked release — for
    # SOMEONE ELSE'S package that is sound; for our own, it is pointless: we will revoke it ourselves.
    cooldown:
      default-days: 3
      exclude: ["vigiles"]

    # One PR for the whole dev tree instead of a PR per package. Without this, the first
    # week yields four separate CI runs and four reviews for one piece of work.
    groups:
      dev-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # Versions of GitHub Actions themselves go stale silently and are only noticed when
  # the runner drops a warning about old Node.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
