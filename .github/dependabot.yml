# Обновления зависимостей ботом, а не глазами.
#
# ЗАЧЕМ ИМЕННО БОТ, а не проверка версии в рантайме: обновление — это ДЕЙСТВИЕ,
# и бот выдаёт pull request, на который можно нажать. Строка в терминале
# «вышло новее» действием не является, её глушат за день. Локальный гейт
# `npm ls vigiles` в потребителе решает ДРУГУЮ задачу — «установленное не
# соответствует манифесту» — и про свежесть относительно реестра не знает
# ничего: замер 2026-09-16 — манифест `^27.1.4` при установленной 27.1.6 и
# 27.2.0 в реестре даёт RC=0, диапазон-то удовлетворён.
#
# ПОЧЕМУ ЭТО МОЖНО ЗДЕСЬ, хотя в соседнем репозитории бота выключали: там
# репозиторий ПРИВАТНЫЙ, и его прогоны ели общую квоту Actions. Этот —
# публичный, минуты у публичных бесплатны, поэтому то возражение сюда не
# переносится. Станет приватным — правило меняется вместе с ним.
#
# 🔴 ЧЕМ ЭТОТ ФАЙЛ НЕ УПРАВЛЯЕТ, и на этом уже наступали: он задаёт только
# version updates. SECURITY-обновления — отдельный механизм и отдельная
# НАСТРОЙКА РЕПОЗИТОРИЯ (Settings → Advanced Security), их частоту и
# группировку отсюда не изменить. Если посыплются одиночные PR по indirect-
# зависимостям — искать рычаг там, а не править этот файл.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # ЕЖЕДНЕВНО, и это осознанно дороже недельного ровно ни на сколько: репозиторий
    # публичный (минуты Actions бесплатны), PR сгруппирован в один, потолок 2 — то
    # есть «чаще» здесь означает только меньшее окно, а не больше шума.
    #
    # 🔴 РАСПИСАНИЕ — НЕ ЕДИНСТВЕННАЯ ЗАДЕРЖКА, и вторую легко не заметить: у
    # version updates есть COOLDOWN, по умолчанию 3 дня — «a new version is not
    # considered for a version update until 3 days after its release». Он НЕ
    # снят намеренно: три дня это защита от только что отозванного релиза, а
    # мы и так узнаём о своих версиях раньше бота (vigiles — наш пакет, его
    # бампают в том же проходе, где мёржат PR). Итоговое окно ~3-4 дня.
    #
    # ⚠️ Публикация в реестр бота НЕ будит — он ходит только по расписанию.
    # Нужно немедленно: Insights -> Dependency graph -> Dependabot -> Check for updates.
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Almaty"
    # Один PR на всё дерево разработки вместо PR на пакет. Без этого первая же
    # неделя даёт четыре отдельных прогона CI и четыре ревью на одну работу.
    groups:
      dev-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # Версии самих GitHub-экшенов протухают молча и заметны только когда
  # runner выкидывает предупреждение об устаревшем Node.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
