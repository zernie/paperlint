# CI for paperlint — every gate, in jobs that run side by side, bonds set BY MEASUREMENT.
#
# ── WHY SEVERAL JOBS (it was ONE until 2026-11-08) ──────────────────────────
# Parallelism does not save billable minutes, it ADDS them: every job pays for its own
# setup + checkout + install (~20-30 s). That argued for one job while the whole suite was ~96 s
# and the minutes were believed to be billed. Neither holds now: the minutes are free (below),
# and the one job, `gates`, took 7 min on #428 and 12 min 4 s on #431, its steps one after
# another although none needs another's result. So the Linux gates are three jobs —
# `coverage`, `static`, `e2e-node` — and a pull request waits on the longest, not on the sum.
#
# ⛽ THIS REPOSITORY IS PUBLIC, so its minutes are FREE — they do not touch the account's
# 3000/month quota (verified against the API 2026-09-12: `"private": false`). The header said
# PRIVATE until then, which was true when written and is the reason the gates were measured
# rather than guessed. Keep measuring them anyway: the bond exists to stop a HANG, and a hang
# costs wall-clock and a red check whether or not anyone is billed.
#
# ── THE MEASUREMENT THE BONDS COME FROM (local, 4 cores, 2026-09-26) ─────────
#   npm run build                         2 s
#   npm test -- --no-skip (69 harnesses) 41 s   ← vitest + every harness
#   npm run lint                          6 s
#   npm run fmt:check                     5 s
#   vigiles lint . README.md              6 s
#   rules-see-files.mjs                   5 s
#   layer-legacy-frozen.ts                3 s
#   npm run test:e2e:install (npm+pnpm) 38 s
#   ───────────────────────────────────────────
#   total work                          ~96 s, plus checkout + install + the claude binary
#
# 🔴 THE PREVIOUS TABLE (2026-09-12) had one more row, `run-mutations.mjs`, at 242 s of ~255 s, and
# by 2026-09-23 it was 8m39s of a 10m02s job (#52). The batteries were removed in #52, which is
# what took the job from `timeout-minutes: 20` to 10. Re-measure when the counts move again; do not
# cite the table above without re-running it.
#
# MEASURED 2026-10-16 on GitHub's runner, not locally: `gates` on main took 9m38s (run 38854596880),
# 6m43s of it `npm test, under coverage`; a branch adding a 16-second step was cancelled by the
# 10-minute bond (run 38909690302). The ~3-minute estimate this bond was set against no longer holds,
# so `timeout-minutes: 15` is ~1.5× the measured job — a bond against a hang, not a budget the suite
# lives inside. `npm ci` carries its OWN bond because a job-level bond cannot tell "the registry hung"
# from "the suite is slow" and so hands a hang the whole job.
name: ci

on:
  push:
    branches: [main]
  # 🔴 `types:` FULLY ENUMERATED, INCLUDING DEFAULTS. As soon as this key is declared, the defaults
  # (`opened`, `synchronize`, `reopened`) DISAPPEAR; forgetting them would disable CI on PR pushes,
  # and the only way to notice would be by the absence of a run, i.e., silence.
  # `ready_for_review` is not a default either, and without it the draft gate below would work only
  # halfway: marking a draft ready is none of the defaults, so the PR would reach the merge button
  # with zero checks. macOS is a cell of the build-e2e matrix below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The deadlines bot's pull request (deadlines.yml) is opened with GITHUB_TOKEN, which starts no
  # other workflow; that job dispatches this one on its branch, so the PR's head commit gets checks.
  workflow_dispatch:

# A newer push supersedes an older one on the same ref. Note this does NOT make the cancelled
# run free — cancellation arrives after the expensive steps have already run and been billed —
# it only stops the tail. (Until 2026-09-23 the key also split on `labeled` events, because a
# label click used to cancel the code run; with no `labeled` trigger that split has nothing to do.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── THREE JOBS, NOT ONE QUEUE ──────────────────────────────────────────────────────────────────
  #
  # These were one job, `gates`, whose steps ran one after another although none needs another's
  # result: on #431 it took 12 min 4 s (the coverage run 8 min 24 s, the static checks ~1 min 50 s,
  # the Node e2e ~1 min 10 s). Split, they run side by side and CI waits on the longest, the
  # coverage run. Each job pays its own `npm ci` (~20 s); the minutes are free (public repository,
  # .github/CLAUDE.md). The local `npm run check` still runs all of them (scripts/check.ts).

  # Every test, under coverage: the unit tests, then the vigiles harnesses, with c8's thresholds.
  coverage:
    # 🔴 A DRAFT PULL REQUEST PAYS NOTHING (same gate as vigiles and the knowledge base). Written as
    # `event_name != 'pull_request' || draft == false`, not `draft == false` alone: on a push to main
    # there is no pull_request object, and a bare `.draft` would be missing and kill every check there.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The floor: engines.node is >=22.13, so the gates run on 22. build-e2e runs 24.
          node-version: 22
          cache: npm

      # 🔴 ITS OWN BOND. This is the only step that talks to the network, and a hung registry is
      # indistinguishable from a slow suite at the job level. Measured in the consumer repo:
      # a `npm ci` without its own bond once held a job for five minutes on a slow mirror.
      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # skills/assess-novelty/scripts/crop_quote.py reads PDFs with PyMuPDF (python3 ships on the runners).
      - name: PyMuPDF for the novelty scripts
        run: python3 -m pip install --break-system-packages pymupdf
        timeout-minutes: 3

      # Harnesses. `--min=1` is inside the script: it refuses a run where NOTHING matched.
      #
      # 🔴 WHAT IT DOES NOT DO, contrary to what was written here before 17.09: it does NOT protect
      # against a directory in the argument. Measurement: `npx vigiles test . --min=1` → `0 passed, 1 skipped`,
      # **RC=0** — the directory exists, discovery treats it as a file, and it counts toward the
      # minimum. The prior version called `--min=1` "load-bearing" precisely against this case,
      # i.e., claimed a protection that does not exist. Protection against this case comes from `--no-skip` below.
      # 🔴 THE `claude` CLI IS A TEST DEPENDENCY HERE, and its absence was NOT harmless.
      # `plan-paper-timeline.effects.harness.mjs` spawns the real agent binary; without it the
      # harness SKIPS, and a skip is not evidence. (Measured 2026-09-15 on run 34966606186, when the
      # since-removed mutation batteries read that skip as two "survivors" in CI and none locally.)
      # This step restores the evidence instead of settling for an honest "no evidence". No API
      # key — the tier drives a scripted stand-in, which is why it costs seconds and $0.
      # 🔴 DELIBERATELY UNPINNED, and since issue #7 that is finally honest. The tier exists to
      # notice upstream moving, so a pin would defeat it — but until the version was OBSERVED
      # rather than probed for, an unpinned install meant the assertions characterized whatever
      # shipped that morning while the docblock named 2.1.227 (measured drift: 2.1.273). The run
      # now prints both numbers, so the log says which version the green belongs to.
      - name: the agent binary the effects tier observes
        run: npm i -g @anthropic-ai/claude-code
        timeout-minutes: 3

      # 🔴 `--no-skip` HERE, AND PRECISELY AFTER THE INSTALL ABOVE. Measurement 17.09: without it,
      # skip is green, and `skip` status is applied not only to author-declared `skip()`, but also to a file
      # that failed to LOAD. In other words, one flag closes both doors at once.
      #
      # ⚠️ The step order was incorrect and made the install above nearly pointless: `npm test`
      # ran BEFORE it, so the effects tier in this job was always skipped. The comment about "its absence was NOT harmless"
      # described exactly this harm yet did not protect against it itself.
      #
      # ⚠️ And the flag belongs IN THE STEP, not in `package.json`: the macOS cell of build-e2e runs the same `npm test`
      # WITHOUT installing the binary, where skips are legitimate, and a global flag would falsely color it.
      #
      # `npm run coverage` is `npm test` under c8 with the thresholds in .c8rc.json: the same tests,
      # one run, and a drop below the coverage floor fails this step by name.
      - name: npm test, under coverage
        run: npm run coverage -- --no-skip

  # Lint, format, types, the skills and the two guards: everything that reads the tree and runs nothing.
  static:
    # 🔴 A DRAFT PULL REQUEST PAYS NOTHING (same gate as vigiles and the knowledge base). Written as
    # `event_name != 'pull_request' || draft == false`, not `draft == false` alone: on a push to main
    # there is no pull_request object, and a bare `.draft` would be missing and kill every check there.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The floor: engines.node is >=22.13, so the gates run on 22. build-e2e runs 24.
          node-version: 22
          cache: npm

      # 🔴 ITS OWN BOND. This is the only step that talks to the network, and a hung registry is
      # indistinguishable from a slow suite at the job level. Measured in the consumer repo:
      # a `npm ci` without its own bond once held a job for five minutes on a slow mirror.
      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # vitest strips types without checking them, so the tests' types are checked here. After
      # `npm ci`, whose `prepare` built `dist/`: the e2e runs import its declarations.
      - name: the tests type-check
        run: npx tsc -p tsconfig.test.json

      # The rules themselves, over this repository's own fixtures. Two of the four fixtures are
      # DEFECTIVE ON PURPOSE, so a healthy checkout reports warnings here and still exits 0 —
      # the pass/fail signal for rule behaviour lives in `npm test`, not in the warning count.
      - name: npm run lint
        run: npm run lint

      # Prettier defaults, the same config as vigiles; `.prettierignore` names what it must not
      # reflow (compiled SKILL.md, fixture data, raw runs) and why.
      - name: npm run fmt:check
        run: npm run fmt:check

      # 🔴 THE ONLY GATE THAT LOOKS AT THE SKILLS THEMSELVES — it existed as a package.json
      # script (`lint:skills`, removed 2026-09-24) long before it was WIRED HERE. That cost
      # nothing while the package shipped rules only; the first skill arrived 2026-09-12 and made it the one check
      # covering frontmatter, `allowed-tools` contracts, dangling pointers and name collisions.
      # `npm run lint` above is ESLint over .tex/.md fixtures and never opens a SKILL.md.
      #
      # A PLAIN GATE, NOT `continue-on-error` — and that is a measurement, not a preference. In
      # the consumer repository this command CANNOT exit 0: a repo-wide "Markdown code block refs"
      # pass walks prose that quotes OTHER projects' commands, so it is pinned under
      # `continue-on-error` there and gates nothing. Measured here on a clean tree 2026-09-12:
      # **28 findings, 0 error, exit 0, 3 seconds**. Nothing to hide, so nothing is hidden.
      #
      # ⚠️ Warnings are expected and do not fail the run (description budgets, missing
      # `disallowed-tools:` fences). What fails it is severity `error` — a malformed frontmatter
      # or a pointer to a file that does not exist. Bond is 3 × the measured 3 s, floored at the
      # 1-minute granularity GitHub bills in.
      #
      # README.md is linted too, by name (see the same gate in scripts/check.ts). Its
      # `vigiles:symbol` marks name the functions behind `paperlint init` and `paperlint new`; if one is
      # renamed or removed, this step fails and names README.md.
      - name: vigiles lint (skills + README.md)
        run: npx vigiles lint . README.md
        timeout-minutes: 2

      # 🔴 THE GREEN-ZERO GUARD. A rule whose glob matches no file is never invoked, and a run
      # with no findings is byte-identical to a run that examined everything and passed. This
      # asks ESLint for the effective config of every linted file and names any rule that saw
      # none. In the source corpus it once found NINETEEN blind rules on a green run.
      - name: every rule sees a file
        run: node scripts/rules-see-files.mjs

      # The legacy exemptions from src/'s layer rules (#76) may only shrink: counted from ESLint's
      # own suppressedMessages, so a new `-- legacy …` directive anywhere fails here.
      - name: legacy layer exemptions are frozen
        run: node scripts/layer-legacy-frozen.ts

  # The end-to-end runs that need only Node: the packed package under npm and pnpm, and a study in git.
  e2e-node:
    # 🔴 A DRAFT PULL REQUEST PAYS NOTHING (same gate as vigiles and the knowledge base). Written as
    # `event_name != 'pull_request' || draft == false`, not `draft == false` alone: on a push to main
    # there is no pull_request object, and a bare `.draft` would be missing and kill every check there.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The floor: engines.node is >=22.13, so the gates run on 22. build-e2e runs 24.
          node-version: 22
          cache: npm

      # 🔴 ITS OWN BOND. This is the only step that talks to the network, and a hung registry is
      # indistinguishable from a slow suite at the job level. Measured in the consumer repo:
      # a `npm ci` without its own bond once held a job for five minutes on a slow mirror.
      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # pnpm is INSTALLED here rather than hoped for. The runner image may or may not carry it,
      # and the npm/pnpm difference is the entire reason the install e2e exists — so leaving it
      # to the image means the half that matters most is covered by luck. `corepack` ships with
      # Node, so this costs a second and no network round-trip to a third-party action.
      - name: enable pnpm
        run: corepack enable pnpm
        timeout-minutes: 2

      # The vitest project `e2e-install`: pack, install under npm and pnpm, run the binary. A manager
      # that does not launch is a skip on a contributor's clone and a FAILURE here, because `CI` is set
      # and in CI it means a broken environment (test/e2e/need.ts).
      - name: npm run test:e2e:install
        run: npm run test:e2e:install
        timeout-minutes: 10

      # A study decided before its run, through the real binary in a real git repository
      # (test/e2e/studies/): `studies gate`, `repro/outputs-before-decision`, and the commits
      # `studies index` writes. git is on the runner image; `CI` is set, so a missing git FAILS the
      # run (test/e2e/need.ts). 16 s on the runner (run 38909690302), 10 s locally.
      - name: npm run test:e2e:studies
        run: npm run test:e2e:studies
        timeout-minutes: 5

  # ── DOES THIS PULL REQUEST CHANGE ANYTHING BUT DOCS? ────────────────────────────────────────────
  # dorny/paths-filter lists a PR's files from the API (no checkout). With `every`, a file counts as
  # code only if it matches all three patterns: anything, but not root or docs/ Markdown.
  changes:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!*.md"
              - "!docs/**/*.md"

  # ── BUILDING THE PAPER WITH REAL pdflatex, ON LINUX AND macOS ──────────────────────────────────
  #
  # 🔴 ONE JOB, TWO OPERATING SYSTEMS. TeX Live comes from `paperlint toolchain` — the same command a user
  # runs — so the job tests the install path users get, not a CI-only script. It used to be a bash
  # installer here and a separate macOS workflow (platform.yml) there; both are gone. macOS matters
  # twice: install-tl-unx has to work on it, and issue #9 (`/var` is a symlink to `/private/var`)
  # exists only there — `npm test` and the temp-dir probe run on macOS in `unit-macos` below, beside
  # this job rather than before its TeX steps.
  #
  # 🔴 WHY A SEPARATE JOB, NOT A STEP OF THE LINUX GATES. Its only dependency is TeX Live, and it alone costs
  # minutes: ~270 MB, ~3 min cold (measured 2026-09-24 with `paperlint toolchain`). A separate job runs in
  # parallel and caches itself.
  #
  # 🔴 WHY ON EVERY PUSH. It catches silent font substitution — a class that HAS ALREADY shipped a
  # paper typeset in the wrong font. This repository is public, so the macOS minutes are free.
  #
  # `CI` is set: absence of TeX locally is a legitimate skip; here it is an environment failure.
  #
  # 🔴 EXCEPT A PULL REQUEST THAT CHANGES ONLY DOCS. A README or docs/*.md edit cannot change what
  # this job builds, and it used to wait for TeX Live on two systems anyway (#343: one new
  # docs/website.md). `changes` below decides; `coverage`, `static` and `e2e-node` still run on such a PR, because tests read
  # the docs. On a push to main or a manual run `changes` does not run and this job always does.
  build-e2e:
    needs: changes
    # `!cancelled()`: without it a skipped `changes` (every push to main) would skip this job too.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The latest LTS; coverage, static and e2e-node cover the 22 floor, so no job runs twice.
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci
        timeout-minutes: 8

      # skills/assess-novelty/scripts/crop_quote.py reads PDFs with PyMuPDF (python3 ships on the runners).
      - name: PyMuPDF for the novelty scripts
        run: python3 -m pip install --break-system-packages pymupdf
        timeout-minutes: 3

      # The cache key is what the install depends on: the runner and the declared packages (every
      # venue profile, the base set included). NOT the TeX Live year, and not the calendar year that
      # used to stand in for it: the calendar says nothing about CTAN's release, and a restored tree
      # from an older year is safe — `paperlint toolchain` verifies every declared file on it, leaves it
      # alone when it is complete, and when a newly declared package makes tlmgr refuse it across
      # releases, installs the new year beside it (src/toolchain.ts, `newRelease`).
      # No `restore-keys`, deliberately: a partial restore would carry the old year's tree into the
      # new entry, and the old tree is never deleted, so the cache would grow by a whole TeX Live.
      - name: where TeX Live is cached
        run: echo "PAPERLINT_TEXLIVE_DIR=$HOME/.cache/paperlint-texlive" >> "$GITHUB_ENV"

      - name: TeX Live from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/paperlint-texlive
          key: texlive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('presets/*.jsonc') }}

      # The same command a user runs. On a cache hit it verifies and says "nothing to do"; on a miss
      # it installs from an empty directory and verifies every declared file with kpsewhich.
      # `node bin/paperlint.mjs`, not `npx paperlint`: inside this repository npx would look the name up on npm.
      # It also downloads banal, the Perl script HotCRP runs to measure page geometry (~90 KB, pinned
      # commit, sha256-checked, then run once on a test page). paperlint keeps banal and no longer needs
      # poppler: paperlint now writes the XML banal reads, which poppler's pdftohtml used to write.
      # Both runner images ship perl. The download is too small to be worth an Actions cache.
      - name: paperlint toolchain
        run: node bin/paperlint.mjs toolchain
        timeout-minutes: 15

      # Every e2e test under test/e2e/tex/, found by the vitest project `e2e-tex`: the toolchain again
      # (a no-op on the tree above, then a build with only it on PATH), the real banal on the XML
      # paperlint writes (no poppler on this runner), and a real pdflatex build of every fixture in
      # fixtures/build-e2e/, each against its own expect.json. `CI` is set on every runner, so a
      # missing TeX Live or banal FAILS here instead of skipping (test/e2e/need.ts).
      - name: npm run test:e2e:tex
        run: npm run test:e2e:tex
        timeout-minutes: 20

  # ── THE UNIT SUITE ON macOS, BESIDE THE TeX JOB, NOT BEFORE IT ─────────────────────────────────
  #
  # 🔴 Issue #9: `npm test` was red ONLY on macOS (`/var` is a symlink to `/private/var`), so it runs
  # there on every push. It used to be a step of build-e2e's macOS cell, BEFORE its TeX steps: on
  # #428 that cell took 13 min (npm test 8 min 11 s, then toolchain 52 s and the TeX e2e 3 min 8 s)
  # while every other job was done in 7. As its own job it runs in parallel with the TeX cell; the
  # minutes are free (public repository, .github/CLAUDE.md). Same gate as build-e2e: a draft, or a
  # pull request that changes only docs, pays nothing.
  unit-macos:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true'))
    # Two halves of the unit suite (vitest's --shard), each on its own runner; scripts/test.ts runs
    # the harnesses on shard 1 only, so each still runs once. fail-fast off: one red half must not
    # cancel the other, whose result is the other half of the answer.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    # ~1.5x the 8 min 11 s the WHOLE suite took on #428's macOS run, plus setup: a bond against a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci
        timeout-minutes: 8

      # skills/assess-novelty/scripts/crop_quote.py reads PDFs with PyMuPDF (python3 ships on the runners).
      - name: PyMuPDF for the novelty scripts
        run: python3 -m pip install --break-system-packages pymupdf
        timeout-minutes: 3

      # Issue #9's distinction: prints BOTH spellings of the temp root. If they match, this machine
      # is not the platform the macOS cell exists for, and green below says nothing about it.
      - name: two spellings of one directory — does this machine see them
        run: |
          node -e '
            const { mkdtempSync, realpathSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const d = mkdtempSync(join(tmpdir(), "probe-"));
            console.log("as typed :", d);
            console.log("realpath :", realpathSync(d));
            console.log(d === realpathSync(d) ? "MATCH — issue #9 traps do not exist on this machine"
                                              : "DIVERGE — this is the platform this job exists for");
          '

      # Issue #9: `npm test` was red ONLY on macOS.
      - name: npm test (macOS), shard ${{ matrix.shard }} of 2
        run: npm test -- --shard=${{ matrix.shard }}/2
        timeout-minutes: 10
