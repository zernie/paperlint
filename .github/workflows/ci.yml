# CI for research-paper-pipeline — ONE job, every gate, bonds set BY MEASUREMENT.
#
# ── WHY ONE JOB ─────────────────────────────────────────────────────────────
# Parallelism does not save billable minutes, it ADDS them: every job pays for its own
# setup + checkout + install (~20-30 s). Splitting is worth it for signal isolation on a big
# matrix; here the whole suite is 84 seconds, so a second job would cost more than it isolates.
#
# ⛽ THIS REPOSITORY IS PUBLIC, so its minutes are FREE — they do not touch the account's
# 3000/month quota (verified against the API 2026-09-12: `"private": false`). The header said
# PRIVATE until then, which was true when written and is the reason the gates were measured
# rather than guessed. Keep measuring them anyway: the bond exists to stop a HANG, and a hang
# costs wall-clock and a red check whether or not anyone is billed.
#
# ── THE MEASUREMENT THE BONDS COME FROM (local, 2026-09-12) ─────────────────
#   npm test (12 harnesses)              11 s
#   npm run lint (eslint over fixtures)   1 s
#   rules-see-files.mjs                   1 s
#   vigiles lint                          3 s   ← added 2026-09-12 with the first ten skills
#   run-mutations.mjs (12 batteries)    242 s   ← 130 mutations, the expensive and load-bearing part
#   ───────────────────────────────────────────
#   total work                          ~255 s, plus checkout + install
#
# 🔴 THE PREVIOUS NUMBERS ARE KEPT NOWHERE BUT THIS SENTENCE, ON PURPOSE: they said ~84 s total
# with `timeout-minutes: 8`, i.e. a ~2.7× bond. The pipeline's checkers arrived on 2026-09-12 and
# tripled every count — 4 harnesses became 12, 45 mutations became 130 — which would have left an
# 8-minute bond at ~1.3× of a ~6-minute run. A bond that tight fails on a slow runner and reads
# as a broken suite rather than as a bond. Re-measure when the counts move again; do not cite the
# table above without re-running it.
#
# Expect ~6 minutes warm. `timeout-minutes: 20` is ~3.3×, and `npm ci` carries its OWN bond
# because a job-level bond cannot tell "the registry hung" from "the suite is slow" and so hands
# a hang the whole job.
name: ci

on:
  push:
    branches: [main]
  # 🔴 `types:` FULLY ENUMERATED, INCLUDING DEFAULTS. As soon as this key is declared, the defaults
  # (`opened`, `synchronize`, `reopened`) DISAPPEAR; forgetting them would disable CI on PR pushes,
  # and the only way to notice would be by the absence of a run, i.e., silence.
  # `ready_for_review` is not a default either, and without it the draft gate below would work only
  # halfway: marking a draft ready is none of the defaults, so the PR would reach the merge button
  # with zero checks. Platform cells (macOS) live in platform.yml, not here.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push supersedes an older one on the same ref. Note this does NOT make the cancelled
# run free — cancellation arrives after the expensive steps have already run and been billed —
# it only stops the tail. (Until 2026-09-23 the key also split on `labeled` events, because a
# label click used to cancel the code run; with no `labeled` trigger that split has nothing to do.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # 🔴 A DRAFT PULL REQUEST PAYS NOTHING (same gate as vigiles and the knowledge base). Written as
    # `event_name != 'pull_request' || draft == false`, not `draft == false` alone: on a push to main
    # there is no pull_request object, and a bare `.draft` would be missing and kill every check there.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The floor: engines.node is >=22.13, so the gates run on 22. build-e2e and macos run 24.
          node-version: 22
          cache: npm

      # 🔴 ITS OWN BOND. This is the only step that talks to the network, and a hung registry is
      # indistinguishable from a slow suite at the job level. Measured in the consumer repo:
      # a `npm ci` without its own bond once held a job for five minutes on a slow mirror.
      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # Harnesses. `--min=1` is inside the script: it refuses a run where NOTHING matched.
      #
      # 🔴 WHAT IT DOES NOT DO, contrary to what was written here before 17.09: it does NOT protect
      # against a directory in the argument. Measurement: `npx vigiles test . --min=1` → `0 passed, 1 skipped`,
      # **RC=0** — the directory exists, discovery treats it as a file, and it counts toward the
      # minimum. The prior version called `--min=1` "load-bearing" precisely against this case,
      # i.e., claimed a protection that does not exist. Protection against this case comes from `--no-skip` below.
      # 🔴 THE `claude` CLI IS A TEST DEPENDENCY HERE, and its absence was NOT harmless.
      # `plan-paper-timeline.effects.harness.mjs` spawns the real agent binary; without it the
      # harness SKIPS, the skip exits 0 through `vigiles test`, and the mutation driver interprets
      # that as "the mutation survived". Measured 2026-09-15 on run 34966606186: two survivors in CI,
      # zero locally, the difference being this binary and nothing about the code.
      #
      # The driver now REFUSES a battery whose harness skips (lib/mutation-driver.mjs), so the
      # wrong diagnosis is gone either way. This step is the other half: it restores the evidence
      # instead of settling for an honest "no evidence". No API key — the tier drives a scripted
      # stand-in, which is why it costs seconds and $0.
      # 🔴 DELIBERATELY UNPINNED, and since issue #7 that is finally honest. The tier exists to
      # notice upstream moving, so a pin would defeat it — but until the version was OBSERVED
      # rather than probed for, an unpinned install meant the assertions characterized whatever
      # shipped that morning while the docblock named 2.1.227 (measured drift: 2.1.273). The run
      # now prints both numbers, so the log says which version the green belongs to.
      - name: the agent binary the effects tier observes
        run: npm i -g @anthropic-ai/claude-code
        timeout-minutes: 3

      # The manifest is judged by the HOST'S validator, not by a schema we wrote from the docs.
      # Measured 2026-09-19: the npm-source shape a design note had recorded is rejected, and the
      # accepted one nests `source` as an object. Since the wrong shape exits nonzero, a gate makes
      # it unshippable. Placed right after the install because the script FAILS when the binary is
      # missing rather than skipping — a gate that passes without its tool is a false green.
      - name: the marketplace manifest
        run: node scripts/marketplace-shape.mjs
        timeout-minutes: 2

      # 🔴 `--no-skip` HERE, AND PRECISELY AFTER THE INSTALL ABOVE. Measurement 17.09: without it,
      # skip is green, and `skip` status is applied not only to author-declared `skip()`, but also to a file
      # that failed to LOAD. In other words, one flag closes both doors at once.
      #
      # ⚠️ The step order was incorrect and made the install above nearly pointless: `npm test`
      # ran BEFORE it, so the effects tier in this job was always skipped, and the binary
      # reached only the mutation batteries. The comment about "its absence was NOT harmless"
      # described exactly this harm yet did not protect against it itself.
      #
      # ⚠️ And the flag belongs IN THE STEP, not in `package.json`: the `macos` job in platform.yml runs the same `npm test`
      # WITHOUT installing the binary, where skips are legitimate, and a global flag would falsely color it.
      - name: npm test
        run: npm test -- --no-skip

      # The rules themselves, over this repository's own fixtures. Two of the four fixtures are
      # DEFECTIVE ON PURPOSE, so a healthy checkout reports warnings here and still exits 0 —
      # the pass/fail signal for rule behaviour lives in `npm test`, not in the warning count.
      - name: npm run lint
        run: npm run lint

      # Prettier defaults, the same config as vigiles; `.prettierignore` names what it must not
      # reflow (compiled SKILL.md, fixture data, raw runs) and why.
      - name: npm run fmt:check
        run: npm run fmt:check

      # 🔴 THE ONLY GATE THAT LOOKS AT THE SKILLS THEMSELVES — it existed as a package.json
      # script (`lint:skills`, removed 2026-09-24) long before it was WIRED HERE. That cost
      # nothing while the package shipped rules only; the first skill arrived 2026-09-12 and made it the one check
      # covering frontmatter, `allowed-tools` contracts, dangling pointers and name collisions.
      # `npm run lint` above is ESLint over .tex/.md fixtures and never opens a SKILL.md.
      #
      # A PLAIN GATE, NOT `continue-on-error` — and that is a measurement, not a preference. In
      # the consumer repository this command CANNOT exit 0: a repo-wide "Markdown code block refs"
      # pass walks prose that quotes OTHER projects' commands, so it is pinned under
      # `continue-on-error` there and gates nothing. Measured here on a clean tree 2026-09-12:
      # **28 findings, 0 error, exit 0, 3 seconds**. Nothing to hide, so nothing is hidden.
      #
      # ⚠️ Warnings are expected and do not fail the run (description budgets, missing
      # `disallowed-tools:` fences). What fails it is severity `error` — a malformed frontmatter
      # or a pointer to a file that does not exist. Bond is 3 × the measured 3 s, floored at the
      # 1-minute granularity GitHub bills in.
      #
      # README.md is linted too, by name (see the same gate in scripts/check.mjs). Its
      # `vigiles:symbol` marks name the functions behind `rpp init` and `rpp new`; if one is
      # renamed or removed, this step fails and names README.md.
      - name: vigiles lint (skills + README.md)
        run: npx vigiles lint . README.md
        timeout-minutes: 2

      # 🔴 THE GREEN-ZERO GUARD. A rule whose glob matches no file is never invoked, and a run
      # with no findings is byte-identical to a run that examined everything and passed. This
      # asks ESLint for the effective config of every linted file and names any rule that saw
      # none. In the source corpus it once found NINETEEN blind rules on a green run.
      - name: every rule sees a file
        run: node scripts/rules-see-files.mjs

      # 45 mutations across 4 batteries. This is what makes the green above mean something: a
      # harness that cannot fail and a harness that passed look identical from outside. The
      # runner DISCOVERS batteries rather than listing them, errors on finding zero, and errors
      # on any harness that has no battery — see scripts/run-mutations.mjs for why (the hand
      # list it replaced had already gone stale by one file, silently).
      - name: mutation batteries
        run: node scripts/run-mutations.mjs

      # pnpm is INSTALLED here rather than hoped for. The runner image may or may not carry it,
      # and the npm/pnpm difference is the entire reason the install e2e exists — so leaving it
      # to the image means the half that matters most is covered by luck. `corepack` ships with
      # Node, so this costs a second and no network round-trip to a third-party action.
      - name: enable pnpm
        run: corepack enable pnpm
        timeout-minutes: 2

      # Called directly with --strict, the same as the build e2e below. --strict: a manager that does not launch is a declared skip on a
      # contributor's clone and a FAILURE here, because in CI it means a broken environment.
      - name: install e2e (--strict)
        run: node test/e2e/install.mjs --strict
        timeout-minutes: 10

  # ── BUILDING THE PAPER WITH REAL pdflatex ──────────────────────────────────────────────────────
  #
  # 🔴 WHY A SEPARATE JOB, NOT A STEP IN `gates`. Its only dependency is TeX Live,
  # and it alone costs minutes here: 230 MB, ~2 min cold (measured and recorded in
  # `skills/render-paper/ci-install-texlive.sh`). Keeping it inside the general job means paying
  # those minutes for every run, including prose edits; a separate job runs in parallel and
  # caches itself.
  #
  # 🔴 WHY NOT ONCE PER PR, like macOS in platform.yml. That job catches a platform divergence that changes once
  # a year. This one catches silent font substitution — a class that HAS ALREADY shipped a paper
  # typeset in the wrong font. A label would make protection depend on whether a person remembered to apply it,
  # and they remember it precisely when they are already being careful.
  #
  # `--strict`: absence of pdflatex locally is a legitimate skip; here it is an environment failure.
  # Without it, a skipped step would look like a pass in the interface.
  build-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The latest LTS; the gates job covers the 22 floor, so no job runs twice.
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # First-party cache chosen deliberately: the correct-by-class
      # `teatimeguest/setup-texlive-action` is blocked by the allowlist of third-party Actions in this
      # account ("Repository access blocked", run 33457399377). Analysis of three approaches with
      # measurements — `skills/render-paper/ci-tex-toolchain-decision.md`.
      - name: TeX Live from cache
        id: tex-cache
        uses: actions/cache@v6
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('skills/render-paper/ci-install-texlive.sh') }}

      - name: install TeX Live (only on cache miss)
        if: steps.tex-cache.outputs.cache-hit != 'true'
        run: bash skills/render-paper/ci-install-texlive.sh
        timeout-minutes: 12

      - name: TeX to PATH
        run: echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"

      # The `:apt` half of the toolchain. TeX Live supplies the `:tex` binaries and nothing else;
      # `pdfinfo` and `pdffonts` ship with poppler, which apt owns. Both halves are declared in ONE
      # place — REQUIRED_BINS in ensure-toolchain.sh — and this step reads that declaration rather
      # than naming packages again, so a binary added there cannot be silently uninstalled here.
      - name: install the apt-supplied tools
        run: |
          set -euo pipefail
          need=$(sed -n '/^REQUIRED_BINS=(/,/)$/p' skills/render-paper/ensure-toolchain.sh \
                 | tr ' ' '\n' | sed -e 's/^REQUIRED_BINS=(//' -e 's/)$//' \
                 | grep ':apt$' | sed 's/:apt$//' | grep -v '^$' | tr '\n' ' ')
          [ -n "$need" ] || { echo "REQUIRED_BINS parsed empty — the parse is broken"; exit 1; }
          echo "apt-supplied binaries declared: $need"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      # 🔴 VERIFY THE INSTALL, NOT THE EXIT CODE. `exit=0` and empty output mean "installed" — the
      # installer once in this corpus downloaded ZERO packages and reported success. The
      # acmart fonts are checked by name, because without ANY of them the class silently falls back to
      # Computer Modern — which is precisely why this entire job exists.
      #
      # 🔴 THE BINARY LIST IS DERIVED, NOT TYPED. It used to read `for b in pdflatex pdffonts`, and
      # that hand-written pair had already drifted from the declaration: `pdffonts` was in the loop
      # and NOT in REQUIRED_BINS, while the `:apt` entries were declared and never installed. The job
      # went red on its first CI run (PR #41) demanding a binary nobody had promised to provide.
      - name: tools and fonts ACTUALLY in place
        run: |
          set -euo pipefail
          need=$(sed -n '/^REQUIRED_BINS=(/,/)$/p' skills/render-paper/ensure-toolchain.sh \
                 | tr ' ' '\n' | sed -e 's/^REQUIRED_BINS=(//' -e 's/)$//' \
                 | grep -E ':(tex|apt)$' | sed 's/:.*$//' | grep -v '^$' | tr '\n' ' ')
          [ -n "$need" ] || { echo "REQUIRED_BINS parsed empty — the parse is broken"; exit 1; }
          for b in $need; do command -v "$b" >/dev/null || { echo "missing $b"; exit 1; }; done
          echo "present: $need"
          for f in acmart.cls libertine.sty zi4.sty newtxmath.sty; do
            kpsewhich "$f" >/dev/null || { echo "missing $f — acmart will SILENTLY fall back to Computer Modern"; exit 1; }
          done

      # Called directly with --strict (see the install e2e step in the `gates` job).
      - name: build e2e (--strict)
        run: node test/e2e/build.mjs --strict
        timeout-minutes: 10
