# CI for research-paper-pipeline — ONE job, every gate, bonds set BY MEASUREMENT.
#
# ── WHY ONE JOB ─────────────────────────────────────────────────────────────
# Parallelism does not save billable minutes, it ADDS them: every job pays for its own
# setup + checkout + install (~20-30 s). Splitting is worth it for signal isolation on a big
# matrix; here the whole suite is 84 seconds, so a second job would cost more than it isolates.
#
# ⛽ THIS REPOSITORY IS PUBLIC, so its minutes are FREE — they do not touch the account's
# 3000/month quota (verified against the API 2026-09-12: `"private": false`). The header said
# PRIVATE until then, which was true when written and is the reason the gates were measured
# rather than guessed. Keep measuring them anyway: the bond exists to stop a HANG, and a hang
# costs wall-clock and a red check whether or not anyone is billed.
#
# ── THE MEASUREMENT THE BONDS COME FROM (local, 2026-09-12) ─────────────────
#   npm test (12 harnesses)              11 s
#   npm run lint (eslint over fixtures)   1 s
#   npm run check:globs                   1 s
#   npm run check:readme                  1 s   <- числа README сверяются с деревом
#   npm run lint:skills (vigiles lint)    3 s   ← added 2026-09-12 with the first ten skills
#   npm run test:sabotage (12 batteries)    242 s   ← 130 mutations, the expensive and load-bearing part
#   ───────────────────────────────────────────
#   total work                          ~255 s, plus checkout + install
#
# 🔴 THE PREVIOUS NUMBERS ARE KEPT NOWHERE BUT THIS SENTENCE, ON PURPOSE: they said ~84 s total
# with `timeout-minutes: 8`, i.e. a ~2.7× bond. The pipeline's checkers arrived on 2026-09-12 and
# tripled every count — 4 harnesses became 12, 45 mutations became 130 — which would have left an
# 8-minute bond at ~1.3× of a ~6-minute run. A bond that tight fails on a slow runner and reads
# as a broken suite rather than as a bond. Re-measure when the counts move again; do not cite the
# table above without re-running it.
#
# Expect ~6 minutes warm. `timeout-minutes: 20` is ~3.3×, and `npm ci` carries its OWN bond
# because a job-level bond cannot tell "the registry hung" from "the suite is slow" and so hands
# a hang the whole job.
name: ci

on:
  push:
    branches: [main]
  # 🔴 `types:` ПЕРЕЧИСЛЕН ЦЕЛИКОМ, ВКЛЮЧАЯ УМОЛЧАНИЯ. Стоит объявить этот ключ — и умолчания
  # (`opened`, `synchronize`, `reopened`) ПРОПАДАЮТ; забыть их значило бы выключить CI на пушах
  # в PR, и заметить это можно было бы только по отсутствию прогона, то есть по тишине.
  # `labeled` добавлен ради macOS-джоба ниже: без него метка, повешенная на открытый PR, ничего
  # не запускает — событие просто не происходит.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A newer push supersedes an older one on the same ref. Note this does NOT make the cancelled
# run free — cancellation arrives after the expensive steps have already run and been billed —
# it only stops the tail.
# 🔴 КЛЮЧ ГРУППЫ РАЗЛИЧАЕТ СОБЫТИЕ, И ЭТО ЗАМЕР, А НЕ ПРЕДОСТОРОЖНОСТЬ (17.09.2026).
# С одним ключом `ci-<ref>` навешивание метки `osx` на только что открытый PR УБИЛО прогон
# гейтов: событие `labeled` попало в ту же группу и отменило идущий `pull_request/opened`.
# Наблюдено на PR #17 — `gates` пришёл `cancelled` в прогоне 44 и `skipped` в прогоне 45, то
# есть полного набора гейтов у PR не оказалось НИ ОДНОГО, при двух зелёных галочках рядом.
#
# Разные ключи потому, что это разные работы: прогон по КОДУ проверяет код, прогон по МЕТКЕ
# проверяет платформу. Отменять первый вторым — терять проверку, а не экономить минуты.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # Навешивание метки — не изменение кода. Без этого условия каждый клик по метке поднимал бы
    # весь шестиминутный набор заново, ничего нового не проверив.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 🔴 ITS OWN BOND. This is the only step that talks to the network, and a hung registry is
      # indistinguishable from a slow suite at the job level. Measured in the consumer repo:
      # a `npm ci` without its own bond once held a job for five minutes on a slow mirror.
      - name: npm ci
        run: npm ci
        timeout-minutes: 5

      # Harnesses. `--min=1` is inside the script and it is load-bearing: `vigiles test` given a
      # DIRECTORY (or a bare `.`) exits 0 having executed nothing, which reads exactly like a
      # clean suite. Measured 2026-09-11 in the consumer repo: `vigiles test eslint-rules/` →
      # "0 passed, 1 skipped", RC=0.
      - name: npm test
        run: npm test

      # The rules themselves, over this repository's own fixtures. Two of the four fixtures are
      # DEFECTIVE ON PURPOSE, so a healthy checkout reports warnings here and still exits 0 —
      # the pass/fail signal for rule behaviour lives in `npm test`, not in the warning count.
      - name: npm run lint
        run: npm run lint

      # 🔴 THE ONLY GATE THAT LOOKS AT THE SKILLS THEMSELVES — declared in package.json since
      # this repository had a `lint:skills` script and NOT WIRED HERE. That cost nothing while the
      # package shipped rules only; the first skill arrived 2026-09-12 and made it the one check
      # covering frontmatter, `allowed-tools` contracts, dangling pointers and name collisions.
      # `npm run lint` above is ESLint over .tex/.md fixtures and never opens a SKILL.md.
      #
      # A PLAIN GATE, NOT `continue-on-error` — and that is a measurement, not a preference. In
      # the consumer repository this command CANNOT exit 0: a repo-wide "Markdown code block refs"
      # pass walks prose that quotes OTHER projects' commands, so it is pinned under
      # `continue-on-error` there and gates nothing. Measured here on a clean tree 2026-09-12:
      # **28 findings, 0 error, exit 0, 3 seconds**. Nothing to hide, so nothing is hidden.
      #
      # ⚠️ Warnings are expected and do not fail the run (description budgets, missing
      # `disallowed-tools:` fences). What fails it is severity `error` — a malformed frontmatter
      # or a pointer to a file that does not exist. Bond is 3 × the measured 3 s, floored at the
      # 1-minute granularity GitHub bills in.
      - name: npm run lint:skills
        run: npm run lint:skills
        timeout-minutes: 2

      # 🔴 THE GREEN-ZERO GUARD. A rule whose glob matches no file is never invoked, and a run
      # with no findings is byte-identical to a run that examined everything and passed. This
      # asks ESLint for the effective config of every linted file and names any rule that saw
      # none. In the source corpus it once found NINETEEN blind rules on a green run.
      - name: npm run check:globs
        run: npm run check:globs

      # README называет числа. Этот шаг их ПРОИЗВОДИТ и сверяет — прежде он был нужен, потому
      # что проза обещала 45 харнессов и 22 батареи при 49 и 26 на диске.
      - name: npm run check:readme
        run: npm run check:readme

      # 45 mutations across 4 batteries. This is what makes the green above mean something: a
      # harness that cannot fail and a harness that passed look identical from outside. The
      # runner DISCOVERS batteries rather than listing them, errors on finding zero, and errors
      # on any harness that has no battery — see scripts/run-mutations.mjs for why (the hand
      # list it replaced had already gone stale by one file, silently).
      # 🔴 THE `claude` CLI IS A TEST DEPENDENCY HERE, and its absence was NOT harmless.
      # `plan-paper-timeline.effects.harness.mjs` spawns the real agent binary; without it the
      # harness SKIPS, the skip exits 0 through `vigiles test`, and the mutation driver read that
      # as "the mutation survived". Measured 2026-09-15 on run 34966606186: two survivors in CI,
      # zero locally, the difference being this binary and nothing about the code.
      #
      # The driver now REFUSES a battery whose harness skips (lib/mutation-driver.mjs), so the
      # wrong diagnosis is gone either way. This step is the other half: it restores the evidence
      # instead of settling for an honest "no evidence". No API key — the tier drives a scripted
      # stand-in, which is why it costs seconds and $0.
      # 🔴 DELIBERATELY UNPINNED, and since issue #7 that is finally honest. The tier exists to
      # notice upstream moving, so a pin would defeat it — but until the version was OBSERVED
      # rather than probed for, an unpinned install meant the assertions characterized whatever
      # shipped that morning while the docblock named 2.1.227 (measured drift: 2.1.273). The run
      # now prints both numbers, so the log says which version the green belongs to.
      - name: the agent binary the effects tier observes
        run: npm i -g @anthropic-ai/claude-code
        timeout-minutes: 3

      - name: mutation batteries
        run: npm run test:sabotage

  # ── macOS ПО МЕТКЕ, А НЕ В МАТРИЦЕ ───────────────────────────────────────────────────────────
  #
  # Issue #9: `npm test` был красным ТОЛЬКО на macOS. Причина — `/var` там симлинк на
  # `/private/var`, поэтому `import.meta.url` резолвится в realpath, а `process.argv[1]` и любой
  # составленный тестом путь остаются как набраны: один каталог под двумя именами. Починка
  # (`50d6463`) закреплена правилом ESLint, но правило сторожит ИДИОМУ, а не поведение — на Linux
  # `realpathSync` тождественна, и снятая обёртка не краснит ни один поведенческий тест. То есть
  # единственный способ узнать, что харнессы на macOS действительно зелёные, — прогнать их там.
  #
  # 🔴 ПОЧЕМУ НЕ ПОСТОЯННАЯ МАТРИЦА. Раннер macOS тарифицируется с МНОЖИТЕЛЕМ 10 к Linux. Для
  # публичного репозитория минуты не выставляются к оплате, но ставить постоянный десятикратный
  # джоб ради платформы, на которой здесь никто не разрабатывает, — это плата за то, что меняется
  # раз в полгода. Метка делает цену решением человека в тот момент, когда он знает, зачем.
  #
  # Как пользоваться: повесить на PR метку `osx`. Событие `labeled` поднимет ЭТОТ джоб, а `gates`
  # выше пропустится — он уже отработал на пуше.
  #
  # ⚠️ Гоняется только `npm test`, и это не экономия ради экономии: предмет #9 — харнессы,
  # читающие временный каталог. Мутационные батареи (242 с) на десятикратном раннере стоили бы
  # сорока минут Linux-эквивалента и проверяли бы ровно то же, что уже проверено на Linux.
  macos:
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'osx')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
        timeout-minutes: 8
      # Различитель, ради которого джоб и существует: печатает ОБА написания временного корня.
      # Совпали — значит платформа не та, и зелёный ниже ничего про macOS не говорит.
      - name: две записи одного каталога — видит ли их эта машина
        run: |
          node -e '
            const { mkdtempSync, realpathSync } = require("node:fs");
            const { tmpdir } = require("node:os");
            const { join } = require("node:path");
            const d = mkdtempSync(join(tmpdir(), "probe-"));
            console.log("as typed :", d);
            console.log("realpath :", realpathSync(d));
            console.log(d === realpathSync(d) ? "СОВПАЛИ — ловушки #9 на этой машине нет"
                                              : "РАЗОШЛИСЬ — это та платформа, ради которой джоб есть");
          '
      - name: npm test
        run: npm test
