# TEMPORARY — delete before merging #81. Checks NPM_TOKEN and rehearses the first release
# without publishing: `npm whoami` proves the token is valid and names its account;
# `semantic-release --dry-run` runs verifyConditions (npm auth, GitHub push access), computes the
# next version and renders the notes, but creates no tag, publishes nothing, comments nowhere.
# `--no-ci` is needed because semantic-release returns early on a pull_request run otherwise
# (node_modules/semantic-release/index.js, "This run was triggered by a pull request").
name: Release rehearsal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  rehearsal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Whose token is NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          test -n "$NPM_TOKEN" || { echo "::error::NPM_TOKEN is empty or not set"; exit 1; }
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
          echo "npm whoami:"
          npm whoami --userconfig "$RUNNER_TEMP/.npmrc"
          echo "npm profile (2FA mode), if this token may read it:"
          npm profile get --json --userconfig "$RUNNER_TEMP/.npmrc" | jq '{name, tfa}' || echo "profile not readable with this token"
          echo "is the name still free:"
          npm view research-paper-pipeline name --userconfig "$RUNNER_TEMP/.npmrc" || echo "not published yet"
          rm -f "$RUNNER_TEMP/.npmrc"
      - name: semantic-release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # env-ci reads the branch from GITHUB_REF (refs/pull/81/merge on a PR) and ignores the
        # checkout, so the first rehearsal stopped before verifyConditions. Present it as a push
        # to the PR branch for this one command.
        run: |
          GITHUB_EVENT_NAME=push GITHUB_REF="refs/heads/${{ github.head_ref }}" \
            npx --no-install semantic-release --dry-run --no-ci --branches "${{ github.head_ref }}"
