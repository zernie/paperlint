# СЛИТЬ ОБНОВЛЕНИЕ ПО ФАКТУ ЗЕЛЁНОГО ПРОГОНА.
#
# 🔴 ПОЧЕМУ НЕ `gh pr merge --auto`, хотя владелец включил «Allow auto-merge» и защиту ветки.
# Штатный авто-мёрдж ждёт ровно те проверки, что объявлены ОБЯЗАТЕЛЬНЫМИ в защите ветки. Это
# настройка в интерфейсе, которую отсюда не видно и которая может разъехаться с `ci.yml` при
# любом переименовании джоба — и разъедется МОЛЧА, потому что PR тогда просто сольётся быстрее.
# Замер 2026-09-16 показал ровно эту цену: до защиты `main` стоял `"protected": false`, и
# `--auto` слил бы PR НЕМЕДЛЕННО, выглядя при этом как «мёрдж по зелёному».
#
# Этот воркфлоу запускается ОТ СОБЫТИЯ ЗАВЕРШЕНИЯ `ci` и читает его `conclusion`. Тот же класс
# рассуждения, что во всех проверках этого репозитория: спрашиваем ВЕЩЬ (вердикт прогона), а не
# её тень (настройку, которая обещает, что вердикт будет учтён).
#
# ⚠️ Защита ветки при этом не лишняя — она закрывает ДРУГУЮ дыру: человека или бота, который
# сольёт PR мимо CI вручную. Два механизма, разные предметы.
#
# 🔴 ПОЧЕМУ МЁРДЖИМ ЛЮБОЙ БАМП, включая мажорный, а не только patch/minor.
# Semver — УТВЕРЖДЕНИЕ ИЗДАТЕЛЯ о своём релизе; `ci` — ЗАМЕР на нашем корпусе (полный набор
# харнессов, мутации, гейты «правила видят свои файлы» и «правила не ходят в git»). Мажорный
# бамп, который нас ломает, красит прогон и не сливается; минорный, который нас ломает, — тоже.
# Фильтр по номеру версии добавил бы ручной шаг там, где измерение уже есть, и пропустил бы
# ровно тот класс, ради которого его обычно и ставят.
#
# ⚠️ ЧЕГО ЭТО НЕ ДАЁТ, названо прямо: зелёный `ci` значит «наши харнессы не заметили разницы»,
# а не «разницы нет». Непокрытое поведение проедет молча — как проехала схема vigiles 19 → 27
# через хук, читавший пустое поле восемь релизов подряд.
name: dependabot auto-merge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

# Слить и удалить ветку — больше этому воркфлоу не нужно ничего.
permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # Три условия, и каждое отсекает своё: прогон был по PR (а не по push в main) ·
    # прогон ЗЕЛЁНЫЙ · автор — бот, а не человек. Убери любое — и смысл меняется.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: слить PR, который только что позеленел
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # 🔴 Номер берётся ИЗ СОБЫТИЯ, а не поиском по имени ветки. Поиск нашёл бы PR, но не
          # доказал бы, что зелёный прогон принадлежит именно ему.
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          # Пустой номер — это НЕ «нечего делать»: у форковых PR массив приходит пустым, и
          # молчаливый выход читался бы как успешный мёрдж. Падаем с причиной.
          if [ -z "${PR}" ]; then
            echo "::error::прогон ci не принёс номера PR (форк?) — ничего не слито, разобрать руками"
            exit 1
          fi
          gh pr merge "${PR}" --repo "${REPO}" --squash --delete-branch
          echo "слит PR #${PR} по зелёному прогону ci ${RUN_ID}"
