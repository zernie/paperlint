# MERGE THE UPDATE UPON A GREEN RUN.
#
# 🔴 WHY NOT `gh pr merge --auto`, even though the owner enabled "Allow auto-merge" and branch protection.
# Standard auto-merge waits for precisely the checks declared REQUIRED in the branch protection. That
# is a setting in the interface, invisible from here, and it can drift from `ci.yml` on any job rename —
# and it WILL drift silently, because the PR will simply merge faster.
# Measurement 2026-09-16 showed exactly this cost: before protection, `main` had `"protected": false`, and
# `--auto` would have merged the PR IMMEDIATELY, looking like "merge on green" while doing the opposite.
#
# This workflow fires FROM THE COMPLETION EVENT of `ci` and reads its `conclusion`. The same reasoning
# as all checks in this repository: we ask for the THING (run verdict), not its shadow (a setting
# that promises the verdict will be considered).
#
# ⚠️ Branch protection is not redundant — it closes a DIFFERENT hole: a person or bot merging
# a PR outside CI manually. Two mechanisms, two concerns.
#
# 🔴 WHY WE MERGE ANY BUMP, INCLUDING MAJOR, not just patch/minor.
# Semver is a PUBLISHER'S CLAIM about their release; `ci` is a MEASUREMENT on our corpus (full harness suite,
# gates for "rules see their files" and "rules don't touch git"). A major bump that breaks us
# reds the run and does not merge; a minor one that breaks us does the same.
# A version-number filter adds a manual step where measurement already exists, and would miss
# exactly the class for which version filters are typically used.
#
# ⚠️ WHAT THIS DOES NOT GIVE, stated plainly: green `ci` means "our harnesses detected no difference,"
# not "no difference exists." Uncovered behavior passes silently — as vigiles schema 19 → 27 passed
# through a hook reading an empty field for eight releases in a row.
name: dependabot auto-merge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

# Merge and delete branch, then start release.yml — nothing else this workflow needs.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    # Three conditions, each blocking a case: the run is GREEN · it was for one of two bots' pull
    # requests, never a person's · and that pull request is the bot's own. Remove any one and
    # meaning changes. The two bots:
    #   - Dependabot: its PR's `ci` is an ordinary `pull_request` run.
    #   - the deadline refresh (deadlines.yml): a PR opened with GITHUB_TOKEN starts no workflow, so
    #     deadlines.yml dispatches `ci` on its branch; that run is `workflow_dispatch` by
    #     github-actions[bot] on `bot/preset-deadlines`, and GitHub still lists the PR in
    #     `pull_requests` (measured on run 39489222900, PR #248).
    if: >
      github.event.workflow_run.conclusion == 'success' && (
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.actor.login == 'dependabot[bot]') ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.actor.login == 'github-actions[bot]' &&
         github.event.workflow_run.head_branch == 'bot/preset-deadlines'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: merge the PR that just turned green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # 🔴 The number comes FROM THE EVENT, not from a search by branch name. A search would find the PR
          # but would not prove the green run belongs to it.
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          # 🔴 The commit the green run TESTED. Without it, a push landing between the run and this job
          # would merge an untested head: `gh pr merge` merges whatever the PR points at NOW.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # An empty number is NOT "nothing to do": fork PRs come with an empty array, and
          # silent exit would look like a successful merge. Fail with a reason.
          if [ -z "${PR}" ]; then
            echo "::error::ci run did not yield a PR number (fork?) — nothing merged, resolve manually"
            exit 1
          fi
          gh pr merge "${PR}" --repo "${REPO}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"
          echo "merged PR #${PR} on green ci run ${RUN_ID}"
          # A merge made with GITHUB_TOKEN pushes to main without starting release.yml (GitHub's rule
          # against loops), so a `fix(presets):` would never be released. Start it by hand; a
          # `deps:` merge releases nothing either way, so the dispatch is harmless there.
          gh workflow run release.yml --repo "${REPO}" --ref main
