# Linter readings run on real repositories (vigiles experimental_ruleProof), triggered only by a push of
# frame/rule-proof/inputs.json to ci/rule-proof-run. The items run in batches, one matrix job per batch (run-batch.mjs
# planOf): GitHub runs at most 256 matrix jobs in a run and bills each job rounded up to the minute, so one job per item
# failed past 256 items and paid a full minute for an item of a few seconds. The run jobs execute other
# repositories' linters and plugins, so they hold no write token and keep no git credentials; only the commit job,
# which runs nothing from those repositories, may push.
name: rule proof run
on:
  push:
    branches: [ci/rule-proof-run]
    paths: [frame/rule-proof/inputs.json]
concurrency:
  group: rule-proof-run
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the runner (vigiles only, no install scripts)
        working-directory: frame/rule-proof
        run: npm install --ignore-scripts --no-audit --no-fund
      # The runner's own selftests gate the run: no repository is run on a runner whose install paths are red.
      - name: runner selftests
        run: node frame/rule-proof/run.selftest.mjs && node frame/rule-proof/install.selftest.mjs
      - id: list
        run: echo "matrix=$(node frame/rule-proof/run.mjs --plan frame/rule-proof/inputs.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Node 22, or the version an item names because its repository's `engines` excludes 22 (a measured case: yarn refused
      # an install under 22 for a package that asks for >=20 <21).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@v6
      - name: corepack for pnpm and yarn lockfiles
        run: corepack enable
      - name: install the runner (vigiles only, no install scripts)
        working-directory: frame/rule-proof
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: run one batch of inputs.json
        timeout-minutes: 145
        run: node frame/rule-proof/run.mjs frame/rule-proof/inputs.json results --run ${{ github.run_id }}-${{ github.run_attempt }} --items ${{ matrix.items }}
      # Only this run's folder is uploaded, so nothing a batch writes elsewhere reaches the commit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-proof-result-${{ matrix.batch }}
          path: results/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
  commit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A run's results go into a folder of their own, keyed by run id and attempt; an earlier run's folder is never
      # written into.
      - name: this run's folder is new
        run: test ! -e "frame/rule-proof/results/${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: rule-proof-result-*
          merge-multiple: true
          path: frame/rule-proof/results/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node's own modules only (nothing installed in the job that holds the write token): every file is a result of an
      # item of inputs.json, naming this run and the commit inputs.json gives; anything else stops the commit.
      - name: check the run's folder
        run: node frame/rule-proof/run-batch.mjs --close frame/rule-proof/inputs.json "frame/rule-proof/results/${{ github.run_id }}-${{ github.run_attempt }}" "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: commit the results back to this branch
        run: |
          git config user.name "rule-proof"
          git config user.email "actions@users.noreply.github.com"
          git add "frame/rule-proof/results/${{ github.run_id }}-${{ github.run_attempt }}"
          git commit -m "rule proof: results (run ${{ github.run_id }}-${{ github.run_attempt }})" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"
