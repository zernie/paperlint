# Repository-frame sizing: one job, triggered only by a push to the branch ci/repo-frame. The result is
# committed back to that branch (a push made with GITHUB_TOKEN does not trigger another run).
name: repo frame
on:
  push:
    branches: [ci/repo-frame]
permissions:
  contents: write
jobs:
  enumerate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: list every candidate, window by window (resumable)
        timeout-minutes: 225
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I frame/stratum_b.py enumerate --pinned frame/pinned-date.txt --out frame/data
      - name: commit the result back to this branch
        if: always()
        run: |
          git config user.name "repo-frame"
          git config user.email "actions@users.noreply.github.com"
          git add frame/data
          git commit -m "frame: list candidates (run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"
