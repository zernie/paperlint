# Repository-frame cross-check with SEART GitHub Search (seart-ghs.si.usi.ch), the tool the older stratum was built
# with. Triggered only by a push to the branch ci/repo-frame-seart; results are committed back to that branch.
name: repo frame seart
on:
  push:
    branches: [ci/repo-frame-seart]
permissions:
  contents: write
jobs:
  seart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: download from SEART (stats, then three exports)
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p seart
          B=https://seart-ghs.si.usi.ch/api/r
          # The server sends its leaf certificate without the intermediate (curl error 60). Verification stays
          # on: fetch the intermediate named in the leaf's own "CA Issuers" field (AIA) and add it to the system
          # trust bundle, so curl still verifies the whole chain up to a root it already trusts.
          H=seart-ghs.si.usi.ch
          echo | openssl s_client -connect $H:443 -servername $H 2>/dev/null | openssl x509 > leaf.pem
          AIA=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
          echo "intermediate from: $AIA"
          curl -sS --fail -m 60 "$AIA" -o int.raw
          openssl x509 -inform DER -in int.raw -out int.pem 2>/dev/null || openssl x509 -in int.raw -out int.pem
          openssl x509 -in int.pem -noout -subject -issuer
          cat /etc/ssl/certs/ca-certificates.crt int.pem > bundle.pem
          C="--cacert bundle.pem"
          curl -sS --fail --retry 3 -m 60 $C "$B/stats" -o seart/stats.json
          get() { curl -sS --fail --retry 3 -m 1800 $C "$B/download/csv?$2" -o "seart/$1.csv.gz"; echo "$1 $(gzip -dc seart/$1.csv.gz | wc -l) lines"; }
          # new cohort, the author's floor, active within a year of 2026-10-30
          get b-100 "createdMin=2025-07-01&commitsMin=100&excludeForks=true&committedMin=2025-10-30"
          # new cohort at the older stratum's floor
          get b-300 "createdMin=2025-07-01&commitsMin=300&excludeForks=true&committedMin=2025-10-30"
          # the older stratum's own query today (created <= 2025-06-30), to compare with the published 165,281
          get a-300 "createdMax=2025-06-30&commitsMin=300&excludeForks=true&committedMin=2025-10-30"
          ls -la seart
      - name: commit the result back to this branch
        if: always()
        run: |
          git config user.name "repo-frame"
          git config user.email "actions@users.noreply.github.com"
          git add seart
          git commit -m "frame: SEART exports (run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"
